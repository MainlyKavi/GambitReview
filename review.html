<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Review - GambitReview</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --dark:#2c2b29;--mid:#4b4847;--card:#232220;
  --green:#4e7837;--green-light:#69923e;
  --cream:#eeeed2;--board-dark:#769656;
  --text:#c8c6b8;--muted:#a09e9c;--dim:#6a6865;--border:#3a3937;
}
html,body{height:100%;background:var(--dark);color:var(--cream);font-family:Montserrat,sans-serif;font-weight:600;overflow:hidden;}

/* ── NAV ── */
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(16px,2.5vw,32px);height:52px;
  background:var(--dark);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.nav-left{display:flex;align-items:center;gap:12px;}
.nav-back{
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:18px;padding:4px 8px;transition:color .15s;
}
.nav-back:hover{color:var(--cream);}
.logo-icon{width:30px;height:30px;background:var(--cream);border-radius:6px;display:flex;align-items:center;justify-content:center;}
.logo-icon img{width:70%;height:70%;object-fit:contain;}
.logo-name{font-weight:800;font-size:17px;letter-spacing:-.5px;}
.logo-name em{font-style:normal;color:var(--green-light);}
.nav-title{font-size:13px;font-weight:700;color:var(--cream);display:flex;align-items:center;gap:6px;}
.nav-title .star{color:var(--green-light);}
.nav-icons{display:flex;gap:8px;}
.nav-icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px;}
.nav-icon-btn:hover{color:var(--cream);}

/* ── MAIN LAYOUT ── */
.review-outer{
  height:calc(100vh - 52px);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1a1918;
  padding:0 clamp(0px,2vw,24px);
}
.review-layout{
  display:flex;
  width:100%;
  max-width:1320px;
  height:100%;
  max-height:920px;
  border:1px solid var(--border);
  border-radius:0;
  overflow:hidden;
}

/* ── LEFT: board panel ── */
.board-panel{
  background:#1a1918;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;
  gap:10px;
  padding:clamp(14px,2vw,28px) clamp(16px,2.5vw,36px);
  border-right:1px solid var(--border);
  flex:1 1 60%;
  box-sizing:border-box;
  min-width:0;
}
.board-inner{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  width:100%;
  max-width:min(72vh,58vw,720px);
}
.player-bar{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:6px 0;gap:10px;flex-shrink:0;
}
.player-info{display:flex;align-items:center;gap:10px;}
.player-avatar{
  width:36px;height:36px;border-radius:50%;
  background:var(--mid);display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;color:var(--cream);flex-shrink:0;
  overflow:hidden;
}
.player-avatar img{width:100%;height:100%;object-fit:cover;}
.player-name{font-size:clamp(12px,1.1vw,15px);font-weight:700;color:var(--cream);}
.player-rating{font-size:clamp(10px,0.9vw,12px);color:var(--muted);font-weight:600;}
.player-material{font-size:10px;color:var(--muted);font-weight:600;margin-top:1px;}
.clock-box{
  background:#2a2927;border:1px solid var(--border);border-radius:5px;
  padding:5px 13px;font-size:clamp(13px,1.1vw,16px);font-weight:700;
  color:var(--cream);font-family:monospace;white-space:nowrap;
}

/* board */
.board-row{display:flex;align-items:stretch;gap:8px;width:100%;}
.eval-bar-vertical{
  width:clamp(14px,1.6vw,22px);
  flex-shrink:0;
  border-radius:4px;
  overflow:hidden;
  border:1px solid var(--border);
  display:flex;
  flex-direction:column;
  background:#1a1a1a;
  position:relative;
}
.eval-bar-vertical.eval-bar-flipped{
  flex-direction:column-reverse;
}
.eval-bar-black{
  background:#1a1a1a;
  width:100%;
  transition:height .4s ease;
}
.eval-bar-white{
  background:var(--cream);
  width:100%;
  transition:height .4s ease;
}
.eval-bar-label{
  position:absolute;
  left:0;right:0;
  text-align:center;
  font-size:clamp(7px,0.65vw,9px);
  font-weight:800;
  font-family:monospace;
  padding:3px 0;
  transition:top .4s ease,bottom .4s ease;
}
.board-wrap{position:relative;flex:1;min-width:0;}
.chess-board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  border-radius:5px;overflow:hidden;
  border:2.5px solid #3a3937;
  width:100%;aspect-ratio:1;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
}
.sq{display:flex;align-items:center;justify-content:center;position:relative;cursor:default;overflow:hidden;}
.sq.light{background:var(--cream);}
.sq.dark{background:var(--board-dark);}
.sq.hl-last{background:rgba(246,234,86,.85)!important;}
.sq.hl-move{background:rgba(246,234,86,.85)!important;}
.sq img{width:100%;height:100%;object-fit:contain;display:block;}
.sq .brill-dot{
  position:absolute;top:-12%;right:-12%;
  width:clamp(14px,1.8vw,24px);height:clamp(14px,1.8vw,24px);
  background:#1edcb4;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(7px,0.8vw,10px);font-weight:800;color:#082920;
  z-index:10;pointer-events:none;
}

/* rank/file labels */
.board-files{
  display:flex;justify-content:space-around;
  width:100%;padding:3px 1px 0;
  padding-left:calc(clamp(14px,1.6vw,22px) + 8px);
}
.board-files span,.board-ranks span{
  font-size:clamp(9px,0.75vw,12px);color:var(--dim);font-weight:700;font-family:monospace;
}
.eval-bar-v{
  width:10px;height:min(56vh,46vw);
  background:#1a1918;border:1px solid var(--border);border-radius:4px;
  overflow:hidden;display:flex;flex-direction:column;
  position:absolute;left:-18px;top:0;
}
.eval-white-fill{background:var(--cream);transition:height .4s;}
.eval-black-fill{background:#444;flex:1;}

/* ── RIGHT: analysis panel ── */
.analysis-panel{
  background:#1e1d1b;
  display:flex;flex-direction:column;
  overflow:hidden;
  flex:1 1 42%;
  min-width:320px;
  max-width:460px;
}

/* comment bubble */
.analysis-status{
  display:flex;align-items:center;gap:10px;
  margin:10px auto 0;width:100%;max-width:420px;
  background:rgba(105,146,62,.12);border:1px solid rgba(105,146,62,.3);
  border-radius:8px;padding:9px 13px;
  font-size:12px;font-weight:600;color:var(--green-light);
  flex-shrink:0;
}
.analysis-spinner{
  width:14px;height:14px;border:2px solid rgba(105,146,62,.3);
  border-top-color:var(--green-light);border-radius:50%;
  animation:spin .7s linear infinite;flex-shrink:0;
}
.comment-bubble{
  margin:12px auto 4px;
  background:#2c2b29;border-radius:8px;
  padding:11px 13px;border-left:3px solid #1edcb4;
  flex-shrink:0;
  width:100%;max-width:420px;
}
.comment-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.comment-badge{
  background:#1edcb4;color:#082920;
  font-size:8px;font-weight:800;padding:2px 8px;
  border-radius:3px;text-transform:uppercase;letter-spacing:.5px;
  flex-shrink:0;
}
.comment-eval{
  background:#333130;color:var(--green-light);
  font-size:10px;font-weight:800;padding:2px 8px;
  border-radius:3px;font-family:monospace;margin-left:auto;
}
.comment-move{
  font-size:12px;font-weight:700;color:var(--cream);
}
.comment-text{
  font-family:Georgia,serif;font-size:clamp(11px,0.85vw,13px);
  color:var(--text);font-style:italic;line-height:1.6;font-weight:normal;
}

/* Nav controls + Share row, stacked: nav buttons on top, Share below */
.panel-controls-row{
  display:flex;flex-direction:column;gap:10px;flex-shrink:0;
  padding:14px;border-top:1px solid var(--border);
  width:100%;max-width:420px;margin:0 auto;box-sizing:border-box;
}
.panel-nav-row{
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.panel-ctrl-share{
  width:100%;background:var(--green);border:1px solid var(--green);color:var(--cream);
  border-radius:8px;padding:0 14px;height:clamp(42px,4.2vw,50px);
  font-family:Montserrat,sans-serif;font-size:clamp(12px,1vw,15px);font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s;letter-spacing:.3px;
}
.panel-ctrl-share:hover{background:var(--green-light);}
.panel-ctrl-btn{
  display:flex;align-items:center;justify-content:center;
  background:#2c2b29;border:1px solid var(--border);color:var(--cream);
  border-radius:8px;width:clamp(42px,4.5vw,56px);height:clamp(42px,4.5vw,56px);
  cursor:pointer;font-size:clamp(16px,1.6vw,22px);font-weight:700;
  transition:background .15s;flex-shrink:0;
}
.panel-ctrl-btn:hover{background:var(--mid);}
#playPauseBtn{
  background:var(--green);border-color:var(--green);
  width:clamp(48px,5vw,62px);height:clamp(48px,5vw,62px);font-size:clamp(18px,1.8vw,24px);
}
#playPauseBtn:hover{background:var(--green-light);}
#playPauseBtn.playing{background:var(--green-light);border-color:var(--green-light);}

/* move list */
.move-list{
  flex:1;overflow-y:auto;padding:6px 0;
  width:100%;max-width:420px;margin:0 auto;
}
.move-list::-webkit-scrollbar{width:4px;}
.move-list::-webkit-scrollbar-thumb{background:var(--mid);border-radius:2px;}
.move-row{
  display:grid;grid-template-columns:30px 1fr 1fr;
  align-items:center;padding:3px 12px;gap:2px;
}
.move-row:hover{background:rgba(255,255,255,.04);}
.move-num{color:var(--dim);font-size:10px;font-weight:700;}
.move-cell{
  display:flex;align-items:center;gap:6px;padding:4px 7px;
  border-radius:4px;cursor:pointer;
  font-size:clamp(11px,0.9vw,13px);font-weight:700;
  transition:background .1s;
}
.move-cell:hover{background:rgba(255,255,255,.08);}
.move-cell.active{background:rgba(105,146,62,.32)!important;box-shadow:inset 0 0 0 1px rgba(105,146,62,.5);}
.ann-dot{
  width:16px;height:16px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;
}
.piece-icon{
  width:17px;height:17px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.piece-icon img{width:100%;height:100%;object-fit:contain;display:block;}
.piece-icon-svg{
  width:15px;height:15px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.piece-icon-svg svg{width:100%;height:100%;}
.piece-icon-best{color:var(--cream);}
.piece-icon-good{color:var(--cream);opacity:.7;}
/* Text colors match Chess.com's annotation palette */
.move-cell.t-brilliant{color:#1bafa3;}
.move-cell.t-best{color:var(--cream);}
.move-cell.t-good{color:var(--cream);}
.move-cell.t-inaccuracy{color:#e0c44c;}
.move-cell.t-mistake{color:#e8883e;}
.move-cell.t-blunder{color:#e05a4e;}

.ann-brilliant{background:#1bafa3;color:#fff;}
.ann-best{background:#5c8a3c;color:#fff;}
.ann-good{background:#7a9e5e;color:#fff;opacity:.75;}
.ann-inaccuracy{background:#e0c44c;color:#1a1a1a;}
.ann-mistake{background:#e8883e;color:#fff;}
.ann-blunder{background:#e05a4e;color:#fff;}
.ann-miss{background:#e8883e;color:#fff;}

/* eval chart at bottom */
.eval-chart-section{
  border-top:1px solid var(--border);padding:10px 14px 8px;flex-shrink:0;
  width:100%;max-width:420px;margin:0 auto;
}
.eval-chart{
  height:60px;width:100%;
  background:#1a1918;border-radius:4px;overflow:hidden;position:relative;
}
.eval-chart canvas{width:100%!important;height:100%!important;}
.eval-labels{display:flex;justify-content:space-between;margin-top:4px;}
.eval-labels span{font-size:9px;color:var(--dim);font-weight:700;}

/* accuracy row */
.accuracy-row{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  padding:10px 14px 14px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);flex-shrink:0;
  width:100%;max-width:420px;margin:0 auto;
}
.acc-box{background:#1a1918;border-radius:6px;padding:8px 10px;text-align:center;}
.acc-label{font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:3px;}
.acc-score{font-size:20px;font-weight:800;letter-spacing:-.5px;}
.acc-sub{font-size:9px;color:var(--muted);font-weight:600;margin-top:2px;}

/* ── LOADING STATE ── */
#loadingState{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;z-index:100;
}
.spinner{
  width:40px;height:40px;border:3px solid var(--border);
  border-top-color:var(--green-light);border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{color:var(--cream);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  .review-outer{padding:0;align-items:flex-start;}
  .review-layout{flex-direction:column;overflow:auto;max-height:none;max-width:100%;border:none;}
  html,body{overflow:auto;}
  .board-panel{padding:16px;border-right:none;border-bottom:1px solid var(--border);flex:none;}
  .board-inner{max-width:min(82vw,400px);}
  .chess-board{width:100%;height:auto;}
  .analysis-panel{min-width:0;max-width:100%;min-height:400px;flex:none;}
}

/* ── PHONE (≤ 480px) ── */
@media(max-width:480px){
  nav{padding:0 14px;height:52px;}
  .logo-name{font-size:15px;}
  .nav-title{font-size:12px;}
  .nav-icons{gap:4px;}

  .board-panel{padding:12px;gap:8px;}
  .board-inner{max-width:92vw;}
  .player-bar{padding:4px 0;}
  .player-avatar{width:26px;height:26px;font-size:12px;}
  .player-name{font-size:12px;}
  .player-rating{font-size:10px;}
  .clock-box{font-size:12px;padding:3px 9px;}

  .board-row{gap:5px;}
  .eval-bar-vertical{width:12px;}
  .eval-bar-label{font-size:7px;}

  .panel-controls-row{padding:10px;gap:8px;}
  .panel-nav-row{gap:6px;}
  .panel-ctrl-share{height:40px;font-size:12px;}
  .panel-ctrl-btn{width:38px;height:38px;font-size:14px;}
  #playPauseBtn{width:44px;height:44px;font-size:16px;}

  .rv-comment, .comment-bubble{margin:8px 8px;padding:8px 9px;max-width:none;}
  .rv-comment-text, .comment-text{font-size:11px;}

  .eval-chart-section{padding:8px 10px 6px;max-width:none;}
  .eval-chart{height:48px;}

  .accuracy-row{padding:8px 10px;gap:6px;max-width:none;}
  .acc-score{font-size:16px;}
  .acc-label{font-size:7px;}

  .move-list{max-width:none;font-size:11px;}
  .move-row{grid-template-columns:22px 1fr 1fr;padding:2px 8px;}
  .piece-icon{width:14px;height:14px;}
  .ann-dot{width:14px;height:14px;font-size:7px;}

  .analysis-panel{min-height:360px;display:flex;flex-direction:column;}
  .panel-controls-row{order:-1;border-top:none;border-bottom:1px solid var(--border);}
  .comment-bubble{order:0;}
  .eval-chart-section{order:1;}
  .accuracy-row{order:2;}
  .move-list{order:3;}
  .analysis-status{order:-1;}
}
</style>
</head>

// ── SOUND ENGINE (synthesized, no external audio files needed) ───────────────
let soundEnabled = true;
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('soundToggleBtn');
  if (btn) {
    btn.textContent = soundEnabled ? '♪' : '✕';
    btn.title = soundEnabled ? 'Sound on (click to mute)' : 'Sound off (click to unmute)';
    btn.style.opacity = soundEnabled ? '1' : '0.5';
  }
}

// A short, dry percussive click — the core building block for move/capture sounds.
// Layers: (1) a tuned resonant "body" pass through a swept lowpass filter for warmth,
// (2) two detuned oscillators for a fuller, less flat-sounding knock,
// (3) a short filtered noise transient for the initial contact snap.
function playClick(opts = {}) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const t0 = ctx.currentTime;
    const dur = opts.duration || 0.05;
    const startFreq = opts.freq || 320;

    // Shared lowpass "body" filter — sweeps down quickly to mimic a damped wood resonance
    const bodyFilter = ctx.createBiquadFilter();
    bodyFilter.type = 'lowpass';
    bodyFilter.frequency.setValueAtTime(startFreq * 6, t0);
    bodyFilter.frequency.exponentialRampToValueAtTime(startFreq * 1.4, t0 + dur);
    bodyFilter.Q.value = 0.7;
    const bodyGain = ctx.createGain();
    bodyGain.gain.setValueAtTime(opts.volume || 0.3, t0);
    bodyGain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    bodyFilter.connect(bodyGain);
    bodyGain.connect(ctx.destination);

    // Two slightly detuned oscillators feeding the body filter for a fuller, warmer tone
    [1, 1.012].forEach((detune, i) => {
      const osc = ctx.createOscillator();
      osc.type = i === 0 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(startFreq * detune, t0);
      osc.frequency.exponentialRampToValueAtTime(startFreq * detune * 0.6, t0 + dur);
      osc.connect(bodyFilter);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    });

    // Click transient — short filtered noise burst for the initial contact snap
    const noiseDur = opts.noiseDuration || 0.02;
    const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * noiseDur));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.2);
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = opts.noiseFreq || 2400;
    noiseFilter.Q.value = 0.9;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(opts.noiseVolume !== undefined ? opts.noiseVolume : 0.22, t0);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, t0 + noiseDur);
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(ctx.destination);
    noise.start(t0);
  } catch (e) { /* fail silently */ }
}

// A short tonal "ping" — used for check/checkmate/promote alerts.
// Adds a faint higher harmonic for shimmer instead of a flat single sine.
function playPing(freq, duration, opts = {}) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const t0 = ctx.currentTime;
    const peak = opts.volume !== undefined ? opts.volume : 0.22;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (opts.freqEnd) osc.frequency.exponentialRampToValueAtTime(opts.freqEnd, t0 + duration);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(peak, t0 + (opts.attack || 0.006));
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);

    // Faint octave-up harmonic layer for shimmer/brightness
    const harm = ctx.createOscillator();
    const harmGain = ctx.createGain();
    harm.type = 'sine';
    harm.frequency.setValueAtTime(freq * 2, t0);
    harmGain.gain.setValueAtTime(0, t0);
    harmGain.gain.linearRampToValueAtTime(peak * 0.18, t0 + (opts.attack || 0.006));
    harmGain.gain.exponentialRampToValueAtTime(0.001, t0 + duration * 0.7);
    harm.connect(harmGain);
    harmGain.connect(ctx.destination);
    harm.start(t0);
    harm.stop(t0 + duration + 0.02);
  } catch (e) { /* fail silently */ }
}

function soundMove() {
  // Single, dry, soft contact click — like a piece tapping down on a board
  playClick({ freq: 340, duration: 0.055, volume: 0.26, noiseFreq: 2600, noiseVolume: 0.14, noiseDuration: 0.016 });
}

function soundCapture() {
  // Two quick, lower-pitched, sharper knocks — piece landing + the captured piece displaced
  playClick({ freq: 220, duration: 0.08, volume: 0.3, noiseFreq: 1700, noiseVolume: 0.26, noiseDuration: 0.024 });
  setTimeout(() => playClick({ freq: 175, duration: 0.055, volume: 0.14, noiseFreq: 1300, noiseVolume: 0.12, noiseDuration: 0.015 }), 35);
}

function soundCastle() {
  // King click, short pause, then the rook's click — two clean contacts
  playClick({ freq: 340, duration: 0.05, volume: 0.24, noiseFreq: 2600, noiseVolume: 0.13 });
  setTimeout(() => playClick({ freq: 300, duration: 0.06, volume: 0.24, noiseFreq: 2300, noiseVolume: 0.14 }), 110);
}

function soundCheck() {
  // The contact click, immediately followed by a bright alert ping
  playClick({ freq: 320, duration: 0.05, volume: 0.24, noiseFreq: 2600, noiseVolume: 0.13 });
  setTimeout(() => playPing(940, 0.17, { type: 'sine', volume: 0.19 }), 30);
}

function soundCheckmate() {
  // Contact click followed by a short descending two-note resolution
  playClick({ freq: 300, duration: 0.05, volume: 0.24, noiseFreq: 2300, noiseVolume: 0.13 });
  setTimeout(() => playPing(720, 0.19, { type: 'sine', volume: 0.21 }), 60);
  setTimeout(() => playPing(470, 0.32, { type: 'sine', volume: 0.21 }), 230);
}

function soundPromote() {
  // Contact click followed by a quick bright ascending shimmer
  playClick({ freq: 340, duration: 0.05, volume: 0.24, noiseFreq: 2600, noiseVolume: 0.13 });
  const notes = [520, 660, 820];
  notes.forEach((f, i) => {
    setTimeout(() => playPing(f, 0.11, { type: 'sine', volume: 0.15 }), 50 + i * 55);
  });
}

// Decide which sound to play for a given SAN move string
function playSoundForMove(san) {
  if (!san) return;
  const clean = san.trim();
  if (clean.includes('#')) { soundCheckmate(); return; }
  if (clean.includes('+')) { soundCheck(); return; }
  if (clean === 'O-O' || clean === 'O-O-O') { soundCastle(); return; }
  if (clean.includes('=')) { soundPromote(); return; }
  if (clean.includes('x')) { soundCapture(); return; }
  soundMove();
}

// ── CHESS ENGINE ───────────────────────────────────────────────────────────
function parsePGNMoves(pgn) {
  if (!pgn) return [];
  let body = pgn.replace(/\[[^\]]*\]/g, '');
  body = body.replace(/\{[^}]*\}/g, '');
  body = body.replace(/\([^)]*\)/g, '');
  body = body.replace(/\$\d+/g, '');
  body = body.replace(/\d+\.\.\./g, '');
  body = body.replace(/1-0|0-1|1\/2-1\/2|\*/g, ' ');
  const tokens = body.split(/\d+\./).map(s => s.trim()).filter(Boolean);
  const moves = [];
  tokens.forEach(pair => {
    const parts = pair.split(/\s+/).filter(Boolean);
    if (parts[0]) moves.push(parts[0]);
    if (parts[1]) moves.push(parts[1]);
  });
  return moves;
}

function newChessBoard() {
  return [
    ['bR','bN','bB','bQ','bK','bB','bN','bR'],
    ['bP','bP','bP','bP','bP','bP','bP','bP'],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['wP','wP','wP','wP','wP','wP','wP','wP'],
    ['wR','wN','wB','wQ','wK','wB','wN','wR']
  ];
}

const FILES = ['a','b','c','d','e','f','g','h'];
function sqToRC(sq) {
  return { r: 8 - parseInt(sq[1],10), c: FILES.indexOf(sq[0]) };
}

// Is the straight/diagonal path between two squares (exclusive of both ends) clear?
function pathClear(board, from, to) {
  const dr = Math.sign(to.r - from.r);
  const dc = Math.sign(to.c - from.c);
  let r = from.r + dr, c = from.c + dc;
  while (r !== to.r || c !== to.c) {
    if (board[r][c] !== '') return false;
    r += dr; c += dc;
  }
  return true;
}

// Can `pieceType` legally move from `from` to `to` on this board (ignoring whose turn it is,
// but respecting blocking pieces and not landing on your own piece)?
function canReach(board, from, to, pieceType, color) {
  if (from.r === to.r && from.c === to.c) return false;
  const destOccupant = board[to.r][to.c];
  if (destOccupant && destOccupant[0] === color) return false; // can't capture own piece

  const dr = to.r - from.r, dc = to.c - from.c;
  const adr = Math.abs(dr), adc = Math.abs(dc);

  switch (pieceType) {
    case 'N':
      return (adr === 2 && adc === 1) || (adr === 1 && adc === 2);
    case 'B':
      if (adr !== adc) return false;
      return pathClear(board, from, to);
    case 'R':
      if (dr !== 0 && dc !== 0) return false;
      return pathClear(board, from, to);
    case 'Q':
      if (dr !== 0 && dc !== 0 && adr !== adc) return false;
      return pathClear(board, from, to);
    case 'K':
      return adr <= 1 && adc <= 1;
    default:
      return true;
  }
}

function applySANMove(board, san, isWhite) {
  san = san.replace(/[+#!?]+$/g, '');
  const color = isWhite ? 'w' : 'b';

  if (san === 'O-O' || san === 'O-O-O') {
    const row = isWhite ? 7 : 0;
    if (san === 'O-O') {
      board[row][6] = color+'K'; board[row][4] = '';
      board[row][5] = color+'R'; board[row][7] = '';
    } else {
      board[row][2] = color+'K'; board[row][4] = '';
      board[row][3] = color+'R'; board[row][0] = '';
    }
    return;
  }

  let promotion = null;
  const pm = san.match(/=([QRBN])$/);
  if (pm) { promotion = pm[1]; san = san.replace(/=([QRBN])$/, ''); }

  const isCapture = san.includes('x');
  let s = san.replace('x', '');
  let pieceType = 'P';
  if (/^[KQRBN]/.test(s)) { pieceType = s[0]; s = s.slice(1); }

  const dest = s.slice(-2);
  const hint = s.slice(0, -2); // disambiguation: file, rank, or both
  const { r: dr, c: dc } = sqToRC(dest);
  const pieceCode = color + pieceType;

  // Gather every piece of this type/color that matches the disambiguation hint (if any)
  let candidates = [];
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (board[r][c] !== pieceCode) continue;
      if (hint) {
        let ok = true;
        for (const ch of hint) {
          if (/[a-h]/.test(ch) && FILES[c] !== ch) ok = false;
          if (/[1-8]/.test(ch) && (8 - r) !== parseInt(ch, 10)) ok = false;
        }
        if (!ok) continue;
      }
      candidates.push({ r, c });
    }
  }

  let from = null;

  if (pieceType === 'P') {
    // Pawns: disambiguation hint (if present) is the departure FILE for captures,
    // otherwise we search straight up/down the destination file.
    const dir = isWhite ? 1 : -1;
    if (isCapture) {
      // hint is the source file letter
      const srcCol = hint ? FILES.indexOf(hint[0]) : dc - 1; // fallback shouldn't normally trigger
      const srcRow = dr + dir;
      if (srcRow >= 0 && srcRow < 8 && board[srcRow][srcCol] === pieceCode) {
        from = { r: srcRow, c: srcCol };
      } else {
        // try the other diagonal as a safety net
        for (const srcC of [dc - 1, dc + 1]) {
          if (srcC >= 0 && srcC < 8 && board[srcRow] && board[srcRow][srcC] === pieceCode) {
            from = { r: srcRow, c: srcC };
            break;
          }
        }
      }
    } else {
      for (let step = 1; step <= 2; step++) {
        const rr = dr + dir * step;
        if (rr < 0 || rr >= 8) break;
        if (board[rr][dc] === pieceCode) {
          // For a 2-square advance, the square in between must be empty
          if (step === 2 && board[dr + dir][dc] !== '') continue;
          from = { r: rr, c: dc };
          break;
        }
      }
    }
  } else if (candidates.length === 1) {
    from = candidates[0];
  } else if (candidates.length > 1) {
    // Multiple same-type pieces: pick the one that can ACTUALLY legally reach the square
    // (respecting blocking pieces), not just geometric direction.
    const legal = candidates.filter(cand => canReach(board, cand, { r: dr, c: dc }, pieceType, color));
    from = legal[0] || candidates[0];
  }

  if (!from) return; // couldn't resolve — leave board unchanged rather than corrupt it

  board[from.r][from.c] = '';
  // En passant: pawn capture landing on an empty square
  if (pieceType === 'P' && isCapture && board[dr][dc] === '') {
    board[from.r][dc] = '';
  }
  board[dr][dc] = promotion ? color + promotion : pieceCode;
}

function buildBoardHistory(sanMoves) {
  const history = [newChessBoard().map(r => r.slice())];
  const board = newChessBoard();
  sanMoves.forEach((san, i) => {
    applySANMove(board, san, i % 2 === 0);
    history.push(board.map(r => r.slice()));
  });
  return history;
}

// ── ANNOTATION HEURISTICS (until Claude API) ─────────────────────────────────
function guessAnnotation(san, i) {
  const clean = san.replace(/[+#!?]/g,'');
  if(clean==='O-O'||clean==='O-O-O') return 'good';
  if(san.includes('x')&&i>4&&Math.random()<0.06) return 'brilliant';
  if(san.includes('+')) return 'good';
  if(san.includes('??')) return 'blunder';
  if(san.includes('?!')) return 'inaccuracy';
  if(san.includes('?')) return 'mistake';
  return i<6?'best':'good';
}

let allMoves=[], currentIdx=0, boardHistory=[], lastFromRC=null, lastToRC=null, boardFlipped=false;

// ── INIT ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const pgn = params.get('pgn') ? decodeURIComponent(params.get('pgn')) : null;
  const storedKey = params.get('key');

  let pgnToUse = pgn;

  // Try sessionStorage if a key was passed
  if(!pgnToUse && storedKey) {
    pgnToUse = sessionStorage.getItem('gp_pgn_' + storedKey);
  }
  if(storedKey) {
    window._gpReviewUsername = sessionStorage.getItem('gp_user_' + storedKey) || '';
  }

  if(pgnToUse) {
    loadGame(pgnToUse);
  } else {
    document.getElementById('loadingState').innerHTML =
      '<div style="color:#e74c3c;font-size:14px;font-weight:700;padding:20px">No game data found.<br><br><a href="GambitReview.html" style="color:var(--green-light)">← Back to GambitReview</a></div>';
  }
});

function sanToPieceType(san) {
  const clean = san.replace(/[+#!?]+$/g, '');
  if (clean === 'O-O' || clean === 'O-O-O') return 'K';
  const noPromo = clean.replace(/=([QRBN])$/, '');
  if (/^[KQRBN]/.test(noPromo)) return noPromo[0];
  return 'P';
}

function loadGame(pgn) {
  const wMatch = pgn.match(/\[White "([^"]+)"\]/);
  const bMatch = pgn.match(/\[Black "([^"]+)"\]/);
  const wRating = pgn.match(/\[WhiteElo "([^"]+)"\]/);
  const bRating = pgn.match(/\[BlackElo "([^"]+)"\]/);
  const wName = wMatch ? wMatch[1] : 'White';
  const bName = bMatch ? bMatch[1] : 'Black';

  document.getElementById('whiteName').textContent = wName;
  document.getElementById('blackName').textContent = bName;
  if(wRating) document.getElementById('whiteRating').textContent = '(' + wRating[1] + ')';
  if(bRating) document.getElementById('blackRating').textContent = '(' + bRating[1] + ')';
  document.title = `${bName} vs ${wName} - GambitReview`;

  // Determine board orientation: the searched/reviewed player's color stays at the bottom.
  // The username we searched for is passed via the URL (key lookup) — stored globally as window._gpReviewUsername.
  const reviewedUsername = (window._gpReviewUsername || '').toLowerCase();
  if (reviewedUsername && reviewedUsername === bName.toLowerCase() && reviewedUsername !== wName.toLowerCase()) {
    boardFlipped = true;
  } else {
    boardFlipped = false; // default: white at bottom (also covers "couldn't determine" case)
  }
  applyBoardOrientation();

  const sanMoves = parsePGNMoves(pgn);
  boardHistory = buildBoardHistory(sanMoves);

  // Render immediately with a neutral placeholder so the board is usable right away
  allMoves = sanMoves.map((san, i) => ({
    num: Math.floor(i/2)+1, side: i%2===0?'w':'b', move: san, ann: 'good',
    histIdx: i+1, piece: sanToPieceType(san)
  }));

  buildMoveList();
  drawEvalChart();
  computeAccuracy();
  currentIdx = 0;
  render();
  document.getElementById('loadingState').style.display='none';

  // Kick off real analysis in the background and update once it arrives
  analyzeGameWithClaude(sanMoves, wName, bName);
}

function applyBoardOrientation() {
  const blackBar = document.getElementById('blackBar');
  const whiteBar = document.getElementById('whiteBar');
  const boardRow = document.querySelector('.board-row');
  const filesRow = document.querySelector('.board-files');
  const boardInner = document.querySelector('.board-inner');
  const evalBarVertical = document.getElementById('evalBarVertical');
  if (!boardInner) return;

  // Default (not flipped): Black bar on top, board, files, White bar.
  // Flipped: White bar on top, board, files, Black bar.
  const topBar = boardFlipped ? whiteBar : blackBar;
  const bottomBar = boardFlipped ? blackBar : whiteBar;

  boardInner.appendChild(topBar);
  boardInner.appendChild(boardRow);
  boardInner.appendChild(filesRow);
  boardInner.appendChild(bottomBar);

  // Flip the eval bar's visual stacking too: white fill should always be on the side
  // closest to the White player's bar (bottom normally, top when flipped).
  if (evalBarVertical) {
    evalBarVertical.classList.toggle('eval-bar-flipped', boardFlipped);
  }
}



// ── CLAUDE API ANALYSIS ────────────────────────────────────────────────────────
async function analyzeGameWithClaude(sanMoves, wName, bName) {
  const banner = document.getElementById('analysisStatus');
  if (banner) banner.style.display = 'flex';

  try {
    const moveListText = sanMoves.map((san, i) => {
      const num = Math.floor(i/2)+1;
      return i%2===0 ? `${num}.${san}` : san;
    }).join(' ');

    const prompt = `You are a chess coach reviewing a game. Here are the moves in SAN notation:

${moveListText}

White: ${wName}, Black: ${bName}

For EVERY half-move, classify it as exactly one of: brilliant, best, good, inaccuracy, mistake, blunder.
Then write ONE short, plain-English coaching sentence (max 25 words) for the 3-5 most important moments in the game (brilliant moves, blunders, and the critical turning point).

Respond ONLY with valid JSON in this exact format, no markdown, no commentary:
{
  "annotations": ["best", "best", "good", ...one per half-move in order...],
  "highlights": [
    {"moveIndex": 0, "comment": "short coaching sentence"},
    ...
  ],
  "whiteAccuracy": 87,
  "blackAccuracy": 72
}

moveIndex is 0-based across all half-moves (White's first move is 0, Black's first reply is 1, etc).
The annotations array MUST have exactly ${sanMoves.length} entries, one per half-move, in order.`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 4000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    const data = await response.json();
    const textBlock = data.content.find(b => b.type === 'text');
    if (!textBlock) throw new Error('No text in Claude response');

    let jsonText = textBlock.text.trim();
    jsonText = jsonText.replace(/^```json\s*/i, '').replace(/```\s*$/, '');
    const analysis = JSON.parse(jsonText);

    applyClaudeAnalysis(analysis);
  } catch (err) {
    console.error('Claude analysis failed, keeping heuristic annotations:', err);
    // Fall back silently to the heuristic guesses already shown
    allMoves.forEach((m, i) => { m.ann = guessAnnotation(m.move, i); });
    buildMoveList();
    drawEvalChart();
    computeAccuracy();
    render();
  } finally {
    if (banner) banner.style.display = 'none';
  }
}

function applyClaudeAnalysis(analysis) {
  if (Array.isArray(analysis.annotations)) {
    analysis.annotations.forEach((ann, i) => {
      if (allMoves[i] && ['brilliant','best','good','inaccuracy','mistake','blunder'].includes(ann)) {
        allMoves[i].ann = ann;
      }
    });
  }

  // Store highlight comments keyed by move index
  window._claudeHighlights = {};
  if (Array.isArray(analysis.highlights)) {
    analysis.highlights.forEach(h => {
      window._claudeHighlights[h.moveIndex] = h.comment;
    });
  }

  if (typeof analysis.whiteAccuracy === 'number') window._claudeWhiteAcc = analysis.whiteAccuracy;
  if (typeof analysis.blackAccuracy === 'number') window._claudeBlackAcc = analysis.blackAccuracy;

  buildMoveList();
  drawEvalChart();
  computeAccuracy();
  render();
}

function updateEvalBar() {
  const whiteEl = document.getElementById('evalBarWhite');
  const blackEl = document.getElementById('evalBarBlack');
  const labelEl = document.getElementById('evalBarLabel');
  if (!whiteEl || !blackEl) return;

  const v = evalValues[currentIdx] !== undefined ? evalValues[currentIdx] : 0;
  // v ranges roughly -5..5 (negative = black advantage, positive = white advantage)
  // Map to a 0-100% white-fill height, clamped so the bar never fully empties on either side.
  const clamped = Math.max(-5, Math.min(5, v));
  let whitePct = 50 + (clamped / 5) * 45; // keeps between 5% and 95%
  whitePct = Math.max(5, Math.min(95, whitePct));

  whiteEl.style.height = whitePct + '%';
  blackEl.style.height = (100 - whitePct) + '%';

  if (labelEl) {
    const absVal = Math.abs(clamped).toFixed(1);
    labelEl.textContent = absVal;
    if (clamped >= 0) {
      // White is ahead (or equal) — label sits near the bottom, on the white fill, dark text
      labelEl.style.bottom = '2px';
      labelEl.style.top = 'auto';
      labelEl.style.color = '#1a1a1a';
    } else {
      // Black is ahead — label sits near the top, on the black fill, light text
      labelEl.style.top = '2px';
      labelEl.style.bottom = 'auto';
      labelEl.style.color = 'var(--cream)';
    }
  }
}

  const filesRow = document.querySelector('.board-files');
  if (filesRow) {
    const files = boardFlipped ? ['h','g','f','e','d','c','b','a'] : ['a','b','c','d','e','f','g','h'];
    filesRow.innerHTML = files.map(f => `<span>${f}</span>`).join('');
  }
}

function highlightActiveMove() {
  document.querySelectorAll('.move-cell').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('mc-'+currentIdx);
  if(el){el.classList.add('active');el.scrollIntoView({block:'nearest',behavior:'smooth'});}
}

function updateComment() {
  const m=allMoves[currentIdx];
  if(!m) return;
  const badge=document.getElementById('commentBadge');
  const evalEl=document.getElementById('commentEval');
  const textEl=document.getElementById('commentText');
  const moveEl=document.getElementById('commentMove');
  const bubble=document.getElementById('commentBubble');
  const ann=m.ann;
  badge.textContent=ann.charAt(0).toUpperCase()+ann.slice(1);
  badge.style.background=ANN_COLORS[ann]||'var(--green)';
  badge.style.color=(ann==='inaccuracy')?'#1a1a1a':'white';
  bubble.style.borderLeftColor=ANN_BORDER[ann]||'var(--border)';
  moveEl.textContent=`${m.num}${m.side==='w'?'.':'..'} ${m.move}`;
  evalEl.textContent='';

  // Prefer Claude's real coaching comment for this exact move if we have one
  const claudeComment = window._claudeHighlights ? window._claudeHighlights[currentIdx] : null;
  if (claudeComment) {
    textEl.textContent = claudeComment;
    return;
  }

  const comments={
    brilliant:`${m.move} is a brilliant move. This is the kind of move that separates strong players — precise, unexpected, and the only path to a winning advantage.`,
    blunder:`${m.move} is a serious blunder. This drops a significant advantage and changes the character of the position completely.`,
    mistake:`${m.move} is an inaccuracy. A better option was available that would have maintained or improved the position.`,
    inaccuracy:`${m.move} is slightly imprecise. Not a losing move, but it lets the opponent off the hook somewhat.`,
    best:`${m.move} is the best move in this position — engine-approved and accurate.`,
    good:`${m.move} is a good move, keeping the position solid and maintaining the balance.`,
  };
  textEl.textContent=comments[ann]||`${m.move} — reviewing this position.`;
}

function jumpTo(idx) {
  const clampedIdx = Math.max(0,Math.min(allMoves.length-1,idx));
  const moved = clampedIdx !== currentIdx;
  currentIdx = clampedIdx;
  render();
  if (moved) {
    const m = allMoves[currentIdx];
    if (m) playSoundForMove(m.move);
  }
}
function nextMove(){jumpTo(currentIdx+1);}
function prevMove(){jumpTo(currentIdx-1);}

// Manual-only wrappers: stop auto-play, then perform the action.
// Bound to the Start/Previous/End buttons and move-list clicks so the user
// taking manual control always cancels auto-play. The auto-play loop itself
// calls nextMove() directly, bypassing these wrappers, so it isn't self-cancelling.
function manualJumpTo(idx){stopAutoPlayIfRunning();jumpTo(idx);}
function manualPrevMove(){stopAutoPlayIfRunning();prevMove();}
function manualNextMove(){stopAutoPlayIfRunning();nextMove();}

// ── AUTO-PLAY ─────────────────────────────────────────────────────────────────
let autoPlayInterval = null;
const AUTO_PLAY_DELAY_MS = 1200;

function toggleAutoPlay() {
  if (autoPlayInterval) {
    stopAutoPlay();
  } else {
    startAutoPlay();
  }
}

function startAutoPlay() {
  // If we're already at the last move, restart from the beginning
  if (currentIdx >= allMoves.length - 1) jumpTo(0);

  const btn = document.getElementById('playPauseBtn');
  if (btn) { btn.textContent = '⏸'; btn.classList.add('playing'); btn.title = 'Pause'; }

  autoPlayInterval = setInterval(() => {
    if (currentIdx >= allMoves.length - 1) {
      stopAutoPlay();
      return;
    }
    nextMove();
  }, AUTO_PLAY_DELAY_MS);
}

function stopAutoPlay() {
  if (autoPlayInterval) {
    clearInterval(autoPlayInterval);
    autoPlayInterval = null;
  }
  const btn = document.getElementById('playPauseBtn');
  if (btn) { btn.textContent = '▶'; btn.classList.remove('playing'); btn.title = 'Auto-play'; }
}

// Any manual navigation should stop auto-play so it doesn't fight the user
function stopAutoPlayIfRunning() {
  if (autoPlayInterval) stopAutoPlay();
}

// Keyboard navigation
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') manualNextMove();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') manualPrevMove();
  if(e.key==='Home') manualJumpTo(0);
  if(e.key==='End') manualJumpTo(allMoves.length-1);
});

// ── MOVE LIST ─────────────────────────────────────────────────────────────────
function moveCellMarker(m, ann) {
  if (ann.special) {
    return `<div class="ann-dot ${ann.cls}">${ann.sym}</div>`;
  }
  // Good/best move: show the actual piece image that moved (same art as the board), scaled down
  const pieceKey = m.side + m.piece; // e.g. 'wN', 'bQ'
  const pieceSrc = PIECES[pieceKey];
  if (pieceSrc) {
    return `<div class="piece-icon"><img src="${pieceSrc}" alt="${pieceKey}"></div>`;
  }
  // Fallback to the SVG silhouette if for some reason the image isn't found
  const pieceSvg = PIECE_ICON_SVG[m.piece] || PIECE_ICON_SVG.P;
  const colorClass = ann.cls === 'ann-best' ? 'piece-icon-best' : 'piece-icon-good';
  return `<div class="piece-icon-svg ${colorClass}">${pieceSvg}</div>`;
}

function buildMoveList() {
  const ml=document.getElementById('moveList');
  const byNum={};
  allMoves.forEach((m,i)=>{(byNum[m.num]=byNum[m.num]||{})[m.side]={...m,idx:i};} );
  let html='';
  Object.keys(byNum).sort((a,b)=>a-b).forEach(num=>{
    const w=byNum[num].w, b=byNum[num].b;
    const wa=ANN[w?.ann]||ANN.good, ba=ANN[b?.ann]||ANN.good;
    html+=`<div class="move-row">
      <span class="move-num">${num}.</span>`;
    if(w) html+=`<div class="move-cell t-${w.ann}" id="mc-${w.idx}" onclick="manualJumpTo(${w.idx})">${moveCellMarker(w,wa)}${w.move}</div>`;
    else html+=`<div></div>`;
    if(b) html+=`<div class="move-cell t-${b.ann}" id="mc-${b.idx}" onclick="manualJumpTo(${b.idx})">${moveCellMarker(b,ba)}${b.move}</div>`;
    else html+=`<div></div>`;
    html+=`</div>`;
  });
  ml.innerHTML=html;
}

// ── EVAL CHART ────────────────────────────────────────────────────────────────
let evalValues = [0]; // shared eval curve, index 0 = start position

function computeEvalValues() {
  evalValues = [0];
  allMoves.forEach(m=>{
    const last=evalValues[evalValues.length-1];
    const delta={brilliant:1.8,best:0.1,good:0,inaccuracy:-0.4,mistake:-0.9,blunder:-2.2};
    const sign=m.side==='w'?1:-1;
    evalValues.push(Math.max(-5,Math.min(5,last+sign*(delta[m.ann]||0)+(Math.random()*.2-.1))));
  });
}

function drawEvalChart() {
  const canvas=document.getElementById('evalCanvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth||300, H=canvas.offsetHeight||60;
  canvas.width=W; canvas.height=H;

  computeEvalValues();
  const vals = evalValues;

  const mid=H/2;
  ctx.clearRect(0,0,W,H);

  // White area (above mid)
  ctx.beginPath();
  ctx.moveTo(0,mid);
  vals.forEach((v,i)=>{const x=i/(vals.length-1)*W,y=mid-v/5*mid;ctx.lineTo(x,y);});
  ctx.lineTo(W,mid);ctx.closePath();
  ctx.fillStyle='rgba(238,238,210,0.85)';ctx.fill();

  // Black area (below mid)
  ctx.beginPath();
  ctx.moveTo(0,mid);
  vals.forEach((v,i)=>{const x=i/(vals.length-1)*W,y=mid-v/5*mid;ctx.lineTo(x,y);});
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
  ctx.fillStyle='rgba(50,50,48,0.9)';ctx.fill();

  // Current position marker
  if(currentIdx<vals.length){
    const x=currentIdx/(vals.length-1)*W;
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);
    ctx.strokeStyle='#1edcb4';ctx.lineWidth=2;ctx.stroke();
  }
}

// ── ACCURACY ─────────────────────────────────────────────────────────────────
function computeAccuracy() {
  const scores={w:{total:0,count:0,best:0,blunder:0},b:{total:0,count:0,best:0,blunder:0}};
  const val={brilliant:100,best:100,good:88,inaccuracy:65,mistake:45,blunder:20};
  allMoves.forEach(m=>{
    const s=scores[m.side];
    s.total+=(val[m.ann]||80);s.count++;
    if(m.ann==='best'||m.ann==='brilliant') s.best++;
    if(m.ann==='blunder') s.blunder++;
  });
  const wAcc = (typeof window._claudeWhiteAcc === 'number') ? window._claudeWhiteAcc
             : (scores.w.count?Math.round(scores.w.total/scores.w.count):0);
  const bAcc = (typeof window._claudeBlackAcc === 'number') ? window._claudeBlackAcc
             : (scores.b.count?Math.round(scores.b.total/scores.b.count):0);
  document.getElementById('whiteAccuracy').textContent=wAcc+'%';
  document.getElementById('blackAccuracy').textContent=bAcc+'%';
  document.getElementById('whiteAccuracy').style.color=wAcc>=75?'#69923e':wAcc>=55?'#d4a843':'#c0392b';
  document.getElementById('blackAccuracy').style.color=bAcc>=75?'#69923e':bAcc>=55?'#d4a843':'#c0392b';
  document.getElementById('whiteAccSub').textContent=`${scores.w.best} best · ${scores.w.blunder} blunder`;
  document.getElementById('blackAccSub').textContent=`${scores.b.best} best · ${scores.b.blunder} blunder`;
}
</script>
