}

function jumpTo(idx) {
  const clampedIdx = Math.max(0,Math.min(allMoves.length-1,idx));
  const moved = clampedIdx !== currentIdx;
  currentIdx = clampedIdx;
  render();
  if (moved) {
    const m = allMoves[currentIdx];
    if (m) playSoundForMove(m.move, m.side);
  }
}
function nextMove(){jumpTo(currentIdx+1);}
function prevMove(){jumpTo(currentIdx-1);}

// Manual-only wrappers: stop auto-play, then perform the action.
// Bound to the Start/Previous/End buttons and move-list clicks so the user
// taking manual control always cancels auto-play. The auto-play loop itself
// calls nextMove() directly, bypassing these wrappers, so it isn't self-cancelling.
function manualJumpTo(idx){stopAutoPlayIfRunning();jumpTo(idx);}
function manualPrevMove(){stopAutoPlayIfRunning();prevMove();}
function manualNextMove(){stopAutoPlayIfRunning();nextMove();}

// ── AUTO-PLAY ─────────────────────────────────────────────────────────────────
let autoPlayInterval = null;
const AUTO_PLAY_DELAY_MS = 1200;

function toggleAutoPlay() {
  if (autoPlayInterval) {
    stopAutoPlay();
  } else {
    startAutoPlay();
  }
}

function startAutoPlay() {
  // If we're already at the last move, restart from the beginning
  if (currentIdx >= allMoves.length - 1) jumpTo(0);

  const btn = document.getElementById('playPauseBtn');
  if (btn) { btn.textContent = '⏸'; btn.classList.add('playing'); btn.title = 'Pause'; }

  autoPlayInterval = setInterval(() => {
    if (currentIdx >= allMoves.length - 1) {
      stopAutoPlay();
      return;
    }
    nextMove();
  }, AUTO_PLAY_DELAY_MS);
}

function stopAutoPlay() {
  if (autoPlayInterval) {
    clearInterval(autoPlayInterval);
    autoPlayInterval = null;
  }
  const btn = document.getElementById('playPauseBtn');
  if (btn) { btn.textContent = '▶'; btn.classList.remove('playing'); btn.title = 'Auto-play'; }
}

// Any manual navigation should stop auto-play so it doesn't fight the user
function stopAutoPlayIfRunning() {
  if (autoPlayInterval) stopAutoPlay();
}

// Keyboard navigation
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') manualNextMove();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') manualPrevMove();
  if(e.key==='Home') manualJumpTo(0);
  if(e.key==='End') manualJumpTo(allMoves.length-1);
});

// ── MOVE LIST ─────────────────────────────────────────────────────────────────
function moveCellMarker(m, ann) {
  return `<div class="ann-dot ${ann.cls}" title="${escapeHtml(ann.label)}">${ann.sym}</div>`;
}

function moveCellTitle(m) {
  const label = ANN[m.ann]?.label || m.ann;
  const loss = typeof m.cpl === 'number' ? `${m.cpl} cp` : '0 cp';
  const acc = typeof m.moveAccuracy === 'number' ? `${m.moveAccuracy}%` : '';
  return `${label} · ${loss}${acc ? ' · ' + acc : ''}`;
}

function buildMoveList() {
  const ml=document.getElementById('moveList');
  const byNum={};
  allMoves.forEach((m,i)=>{(byNum[m.num]=byNum[m.num]||{})[m.side]={...m,idx:i};} );
  let html='';
  Object.keys(byNum).sort((a,b)=>a-b).forEach(num=>{
    const w=byNum[num].w, b=byNum[num].b;
    const wa=ANN[w?.ann]||ANN.good, ba=ANN[b?.ann]||ANN.good;
    html+=`<div class="move-row">
      <span class="move-num">${num}.</span>`;
    if(w) html+=`<div class="move-cell t-${w.ann}" id="mc-${w.idx}" onclick="manualJumpTo(${w.idx})" title="${escapeHtml(moveCellTitle(w))}">${moveCellMarker(w,wa)}<span class="move-san">${escapeHtml(w.move)}</span></div>`;
    else html+=`<div></div>`;
    if(b) html+=`<div class="move-cell t-${b.ann}" id="mc-${b.idx}" onclick="manualJumpTo(${b.idx})" title="${escapeHtml(moveCellTitle(b))}">${moveCellMarker(b,ba)}<span class="move-san">${escapeHtml(b.move)}</span></div>`;
    else html+=`<div></div>`;
    html+=`</div>`;
  });
  ml.innerHTML=html;
}

// ── EVAL CHART ────────────────────────────────────────────────────────────────
let evalValues = [0]; // shared eval curve, index 0 = start position

function computeEvalValues() {
  if (reviewReport && Array.isArray(reviewReport.evalValues)) {
    evalValues = reviewReport.evalValues.slice();
    return;
  }
  evalValues = [0];
  allMoves.forEach((m, i) => {
    evalValues.push(evaluateBoard(boardHistory[i + 1] || newChessBoard()));
  });
}

function drawEvalChart() {
  const canvas=document.getElementById('evalCanvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth||300, H=canvas.offsetHeight||60;
  canvas.width=W; canvas.height=H;

  computeEvalValues();
  const vals = evalValues;

  const mid=H/2;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#181817';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.12)';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(W,mid);ctx.stroke();

  // White area (above mid)
  ctx.beginPath();
  ctx.moveTo(0,mid);
  vals.forEach((v,i)=>{
    const x=vals.length>1?i/(vals.length-1)*W:0;
    const y=Math.max(4,Math.min(H-4,mid-v/5*mid));
    ctx.lineTo(x,y);
  });
  ctx.lineTo(W,mid);ctx.closePath();
  ctx.fillStyle='rgba(238,238,210,0.78)';ctx.fill();

  // Black area (below mid)
  ctx.beginPath();
  ctx.moveTo(0,mid);
  vals.forEach((v,i)=>{
    const x=vals.length>1?i/(vals.length-1)*W:0;
    const y=Math.max(4,Math.min(H-4,mid-v/5*mid));
    ctx.lineTo(x,y);
  });
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
  ctx.fillStyle='rgba(64,64,59,0.92)';ctx.fill();

  // Current position marker
  const markerIdx = Math.min(currentIdx + 1, vals.length - 1);
  if(markerIdx<vals.length){
    const x=vals.length>1?markerIdx/(vals.length-1)*W:0;
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);
    ctx.strokeStyle='#20ccb2';ctx.lineWidth=2;ctx.stroke();
  }
}

// ── ACCURACY ─────────────────────────────────────────────────────────────────
function materialAdvantage(board) {
  let score = 0;
  board.forEach(row => row.forEach(piece => {
    if (!piece) return;
    score += (piece[0] === 'w' ? 1 : -1) * pieceValue(piece);
  }));
  return Math.round(score * 10) / 10;
}

function updateMaterialPanels() {
  const idx = allMoves[currentIdx] ? allMoves[currentIdx].histIdx : 0;
  const board = boardHistory[idx] || boardHistory[0] || newChessBoard();
  const score = materialAdvantage(board);
  const whiteMat = document.getElementById('whiteMaterial');
  const blackMat = document.getElementById('blackMaterial');
  if (!whiteMat || !blackMat) return;
  whiteMat.textContent = score > 0 ? '+' + score : '';
  blackMat.textContent = score < 0 ? '+' + Math.abs(score) : '';
}

function computeAccuracy() {
  const scores={w:{total:0,count:0,best:0,blunder:0},b:{total:0,count:0,best:0,blunder:0}};
  const val=ANN_SCORE;
  allMoves.forEach(m=>{
    const s=scores[m.side];
    s.total+=(val[m.ann]||80);s.count++;
    if(['brilliant','great','best','book'].includes(m.ann)) s.best++;
    if(m.ann==='blunder'||m.ann==='mistake') s.blunder++;
  });
  const wAcc = reviewReport ? reviewReport.whiteAccuracy : (scores.w.count?Math.round(scores.w.total/scores.w.count):0);
  const bAcc = reviewReport ? reviewReport.blackAccuracy : (scores.b.count?Math.round(scores.b.total/scores.b.count):0);
  const needsEngine = reviewReport?.evalSource === 'estimate';
  if (needsEngine) {
    document.getElementById('whiteAccuracy').textContent='--';
    document.getElementById('blackAccuracy').textContent='--';
    document.getElementById('whiteAccuracy').style.color='var(--muted)';
    document.getElementById('blackAccuracy').style.color='var(--muted)';
    document.getElementById('whiteAccSub').textContent='Engine needed';
    document.getElementById('blackAccSub').textContent='Engine needed';
    return;
  }
  document.getElementById('whiteAccuracy').textContent=wAcc+'%';
  document.getElementById('blackAccuracy').textContent=bAcc+'%';
  document.getElementById('whiteAccuracy').style.color=wAcc>=75?'#69923e':wAcc>=55?'#d4a843':'#c0392b';
  document.getElementById('blackAccuracy').style.color=bAcc>=75?'#69923e':bAcc>=55?'#d4a843':'#c0392b';
  const acplLabel = ['engine','cloud','cloud-mixed'].includes(reviewReport?.evalSource) ? 'ACPL' : 'Local ACPL';
  document.getElementById('whiteAccSub').textContent=`${acplLabel} ${reviewReport?.whiteAcpl ?? 0}`;
  document.getElementById('blackAccSub').textContent=`${acplLabel} ${reviewReport?.blackAcpl ?? 0}`;
}

   This intentionally overrides the earlier local/cloud review helpers while keeping
   the existing board UI, move list, sounds, and sharing controls. */
const STOCKFISH_CANDIDATES = [
  {
    name: 'Stockfish 18 local',
    js: 'stockfish/stockfish-18-lite-single.js',
    wasm: 'stockfish/stockfish-18-lite-single.wasm'
  },

    wasm: 'https://unpkg.com/stockfish@18.0.8/bin/stockfish-18-lite-single.wasm'
  },
  {
    name: 'Stockfish 18 ASM fallback',
    js: 'https://unpkg.com/stockfish@18.0.8/bin/stockfish-18-asm.js',
    wasm: null
  }
];
const STOCKFISH_TIMEOUT_MS = 12000;
const STOCKFISH_MATE_PAWNS = 12;
let stockfishEnginePromise = null;
let stockfishActiveEngine = null;

function resolveAssetUrl(path) {
  if (!path) return path;
  try { return new URL(path, window.location.href).href; }
  catch(e) { return path; }
}

function stripPGNLineComments(text) {
  return String(text || '').replace(/;[^\r\n]*/g, ' ');
}

function parsePGNDetails(pgn) {
  if (!pgn) return [];
  let body = stripPGNLineComments(pgn).replace(/^\s*\[[^\]]*\]\s*$/gm, ' ');
  body = stripPGNVariations(body).replace(/\r?\n/g, ' ');
  const tokens = body.match(/\{[^}]*\}|\$\d+|\d+\.(?:\.\.)?|1-0|0-1|1\/2-1\/2|\*|[^\s{}]+/g) || [];
  const moves = [];
  let lastMove = null;

  tokens.forEach(token => {
    if (/^\{/.test(token)) {
      if (lastMove) {
        const comment = token.slice(1, -1).trim();
        const parsedEval = extractCommentEval(comment);
        lastMove.comment = comment;
        if (parsedEval !== null) lastMove.evalAfter = parsedEval;
      }
      return;
    }
    if (/^\$\d+/.test(token)) {
      if (lastMove) lastMove.nags.push(token);
      return;
    }
    if (/^(1-0|0-1|1\/2-1\/2|\*)$/.test(token) || /^\d+\.(?:\.\.)?$/.test(token)) return;

    let san = token.replace(/^\d+\.(?:\.\.)?/, '').replace(/^\.{3}/, '').trim();
    if (!san || /^(1-0|0-1|1\/2-1\/2|\*)$/.test(san)) return;
    san = san.replace(/[,\s]+$/g, '');
    const annotatedSan = san;
    san = san.replace(/[?!]+$/g, '');
    if (!san || !/[a-hKQRBNO0]/.test(san)) return;
    lastMove = { san, annotatedSan, nags: [], comment: '', evalAfter: null };
    moves.push(lastMove);
  });

  return moves;
}

function applySANMoveDetailed(board, san, isWhite) {
  const originalSan = san;
  san = String(san || '').replace(/0-0/g, 'O-O').replace(/[+#!?]+$/g, '');
  const color = isWhite ? 'w' : 'b';
  const fail = extra => ({
    san: originalSan, piece: extra?.piece || '', color, from: null, to: extra?.to || null,
    captured: '', promotion: extra?.promotion || null, castle: false, success: false
  });

  if (san === 'O-O' || san === 'O-O-O') {
    const row = isWhite ? 7 : 0;
    const kingTo = san === 'O-O' ? 6 : 2;
    const rookFrom = san === 'O-O' ? 7 : 0;
    const rookTo = san === 'O-O' ? 5 : 3;
    if (board[row][4] !== color + 'K' || board[row][rookFrom] !== color + 'R') return fail({ piece:'K' });
    board[row][kingTo] = color+'K'; board[row][4] = '';
    board[row][rookTo] = color+'R'; board[row][rookFrom] = '';
    return { san: originalSan, piece: 'K', color, from: { r: row, c: 4 }, to: { r: row, c: kingTo }, captured: '', promotion: null, castle: true, success: true };
  }

  let promotion = null;
  const pm = san.match(/=([QRBN])$/);
  if (pm) { promotion = pm[1]; san = san.replace(/=([QRBN])$/, ''); }

  const isCapture = san.includes('x');
  let s = san.replace('x', '');
  let pieceType = 'P';
  if (/^[KQRBN]/.test(s)) { pieceType = s[0]; s = s.slice(1); }

  const dest = s.slice(-2);
  if (!/^[a-h][1-8]$/.test(dest)) return fail({ piece: pieceType, promotion });
  const hint = s.slice(0, -2);
  const { r: dr, c: dc } = sqToRC(dest);
  const pieceCode = color + pieceType;
  let candidates = [];

  function isLegalCandidate(from) {
    const preview = cloneBoard(board);
    const captured = preview[dr][dc] || (pieceType === 'P' && isCapture ? preview[from.r]?.[dc] : '');
    preview[from.r][from.c] = '';
    if (pieceType === 'P' && isCapture && preview[dr][dc] === '') preview[from.r][dc] = '';
    preview[dr][dc] = promotion ? color + promotion : pieceCode;
    return !isKingInCheck(preview, color) || !findKing(preview, color);
  }

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (board[r][c] !== pieceCode) continue;
      if (hint) {
        let ok = true;
        for (const ch of hint) {
          if (/[a-h]/.test(ch) && FILES[c] !== ch) ok = false;
          if (/[1-8]/.test(ch) && (8 - r) !== parseInt(ch, 10)) ok = false;
        }
        if (!ok) continue;
      }
      candidates.push({ r, c });
    }
  }

  let from = null;
  if (pieceType === 'P') {
    const dir = isWhite ? 1 : -1;
    const pawnSources = [];
    if (isCapture) {
      const srcRow = dr + dir;
      const hintedCol = hint && /[a-h]/.test(hint[0]) ? FILES.indexOf(hint[0]) : -1;
      const cols = hintedCol >= 0 ? [hintedCol] : [dc - 1, dc + 1];
      cols.forEach(srcCol => {
        if (inBounds(srcRow, srcCol) && board[srcRow][srcCol] === pieceCode) pawnSources.push({ r: srcRow, c: srcCol });
      });
    } else {
      for (let step = 1; step <= 2; step++) {
        const rr = dr + dir * step;
        if (!inBounds(rr, dc)) break;
        if (board[rr][dc] === pieceCode) {
          if (step === 2 && board[dr + dir][dc] !== '') continue;
          pawnSources.push({ r: rr, c: dc });
        }
      }
    }
    from = pawnSources.find(isLegalCandidate) || pawnSources[0] || null;
  } else {
    const legal = candidates
      .filter(cand => canReach(board, cand, { r: dr, c: dc }, pieceType, color))
      .filter(isLegalCandidate);
    from = legal[0] || candidates.filter(cand => canReach(board, cand, { r: dr, c: dc }, pieceType, color))[0] || null;
  }

  if (!from) return fail({ piece: pieceType, to: { r: dr, c: dc }, promotion });

  const captured = board[dr][dc] || (pieceType === 'P' && isCapture ? board[from.r][dc] : '');
  board[from.r][from.c] = '';
  if (pieceType === 'P' && isCapture && board[dr][dc] === '') board[from.r][dc] = '';
  board[dr][dc] = promotion ? color + promotion : pieceCode;
  return { san: originalSan, piece: pieceType, color, from, to: { r: dr, c: dc }, captured, promotion, castle: false, success: true };
}

function validateReplay(moveDetails) {
  if (!moveDetails.length) return { ok:false, message:'This PGN does not contain any moves.' };
  const board = newChessBoard();
  for (let i = 0; i < moveDetails.length; i++) {
    const info = applySANMoveDetailed(board, moveDetails[i].san, i % 2 === 0);
    if (!info || !info.success) {
      const moveNo = Math.floor(i / 2) + 1;
      const side = i % 2 === 0 ? 'White' : 'Black';
      return { ok:false, message:`I could not replay ${side}'s move ${moveNo}: ${moveDetails[i].san}. Paste a standard PGN without illegal moves or unsupported variants.` };
    }
  }
  return { ok:true };
}

function loadGame(pgn) {

  const bMatch = pgn.match(/\[Black "([^"]+)"\]/);

  document.getElementById('blackRating').textContent = Number.isFinite(currentBlackElo) ? '(' + currentBlackElo + ')' : '';
  document.title = `${bName} vs ${wName} - GambitReview`;

  const reviewedUsername = (window._gpReviewUsername || '').toLowerCase();
  boardFlipped = !!(reviewedUsername && reviewedUsername === bName.toLowerCase() && reviewedUsername !== wName.toLowerCase());
  applyBoardOrientation();

  const moveDetails = parsePGNDetails(pgn);
  const validation = validateReplay(moveDetails);
  if (!validation.ok) {
    showReviewError(validation.message);
    return;
  }

  currentMoveDetails = moveDetails;
  const sanMoves = moveDetails.map(m => m.san);
  boardHistory = buildBoardHistory(sanMoves);
  fenHistory = buildFenHistory();

  allMoves = sanMoves.map((san, i) => ({
    num: Math.floor(i/2)+1,
    side: i%2===0?'w':'b',
    move: san,
    annotatedMove: moveDetails[i]?.annotatedSan || san,

  }));

}

function loadStockfishScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = resolveAssetUrl(src);
    script.async = true;
    script.onload = () => resolve(script);
    script.onerror = () => reject(new Error('Could not load ' + src));
    document.head.appendChild(script);
  });
}

function waitForCondition(fn, timeoutMs, label) {
  return new Promise((resolve, reject) => {
    const started = Date.now();
    (function tick() {
      if (fn()) { resolve(); return; }
      if (Date.now() - started > timeoutMs) { reject(new Error(label + ' timed out')); return; }
      setTimeout(tick, 25);
    })();
  });
}

class UciStockfishEngine {
  constructor(module, name) {
    this.module = module;
    this.name = name;
    this.current = null;
    this.queue = [];
  }

  onLine(line) {
    if (!line || !this.current) return;
    const job = this.current;
    job.lines.push(line);
    if (job.stream) job.stream(line);
    if (job.done(line, job.lines)) {
      clearTimeout(job.timer);
      this.current = null;
      job.resolve(job.lines.join('\n'));
      this.pump();
    }
  }

  sendRaw(cmd) {
    if (this.module.processCommand) {
      this.module.processCommand(cmd);
      return;
    }
    this.module.ccall('command', null, ['string'], [cmd], { async: /^go\b/.test(cmd) });
  }

  send(cmd) {
    this.sendRaw(cmd);
  }

  command(cmd, done, stream, timeoutMs=STOCKFISH_TIMEOUT_MS) {
    return new Promise((resolve, reject) => {
      this.queue.push({ cmd, done, stream, timeoutMs, lines: [], resolve, reject, timer: null });
      this.pump();
    });
  }

  pump() {
    if (this.current || !this.queue.length) return;
    const job = this.queue.shift();
    this.current = job;
    job.timer = setTimeout(() => {
      this.current = null;
      job.reject(new Error('Stockfish timed out on ' + job.cmd));
      this.pump();
    }, job.timeoutMs);
    this.sendRaw(job.cmd);
  }

  async init() {
    await this.command('uci', line => line === 'uciok', null, 9000);
    this.send('setoption name Hash value 64');
    this.send('setoption name MultiPV value 3');
    this.send('setoption name UCI_ShowWDL value true');
    this.send('ucinewgame');
    await this.command('isready', line => line === 'readyok', null, 9000);
  }

  async analyzeFen(fen, depth) {
    let bestMove = '';
    let bestPv = [];
    let bestDepth = 0;
    const linesByMultiPv = {};
    const side = fen.split(/\s+/)[1] || 'w';

    this.send('position fen ' + fen);
    const output = await this.command(
      'go depth ' + depth,
      line => line.startsWith('bestmove'),
      line => {
        if (line.startsWith('info ')) {
          const depthMatch = line.match(/\bdepth\s+(\d+)/);
          const scoreMatch = line.match(/\bscore\s+(cp|mate)\s+(-?\d+)/);
          const multiPvMatch = line.match(/\bmultipv\s+(\d+)/);
          const pvMatch = line.match(/\bpv\s+(.+)$/);
          const lineDepth = depthMatch ? parseInt(depthMatch[1], 10) : 0;
          const multiPv = multiPvMatch ? parseInt(multiPvMatch[1], 10) : 1;
          if (lineDepth) bestDepth = Math.max(bestDepth, lineDepth);
          if (pvMatch) {
            const pv = formatUciPv(fen, pvMatch[1].trim().split(/\s+/).filter(Boolean));
            const previous = linesByMultiPv[multiPv];
            if (scoreMatch && pv.length && (!previous || lineDepth >= previous.depth)) {
              const normalized = scoreToWhiteEval({ type: scoreMatch[1], value: parseInt(scoreMatch[2], 10), side });
              linesByMultiPv[multiPv] = {
                pv,
                depth: lineDepth,
                multiPv,
                cp: normalized.cp,
                mate: normalized.mate,
                eval: normalized.eval
              };
            }
          }
        }
      },
      Math.max(10000, depth * 2200)
    );

    const bestMatch = output.match(/bestmove\s+([a-h][1-8][a-h][1-8][qrbn]?)/);
    const lines = Object.values(linesByMultiPv).sort((a, b) => a.multiPv - b.multiPv);
    bestPv = lines[0]?.pv || [];
    bestMove = bestMatch ? bestMatch[1] : (bestPv[0] || '');
    const normalized = lines[0] || { eval: 0, cp: 0, mate: null };
    return {
      eval: normalized.eval,
      cp: normalized.cp,
      mate: normalized.mate,
      bestMove,
      depth: bestDepth || depth,
      pv: bestPv,
      lines
    };
  }
}

async function createStockfishFromCandidate(candidate) {
  let engine = null;
  const script = await loadStockfishScript(candidate.js);
  const init = script._exports || window.Stockfish;
  if (typeof init !== 'function') throw new Error(candidate.name + ' did not expose an engine');
  const module = {
    locateFile(path, prefix) {
      if (candidate.wasm && path.indexOf('.wasm') > -1) return resolveAssetUrl(candidate.wasm);
      return prefix ? prefix + path : path;
    },
    print(line) { if (engine) engine.onLine(String(line)); },
    printErr(line) { console.warn('[Stockfish]', line); },
    listener(line) { if (engine) engine.onLine(String(line)); }
  };
  await init(module);
  await waitForCondition(() => module.processCommand || module.ccall, 9000, candidate.name);
  engine = new UciStockfishEngine(module, candidate.name);
  module.listener = line => engine.onLine(String(line));
  module.print = line => engine.onLine(String(line));
  await engine.init();
  return engine;
}

async function getStockfishEngine() {
  if (stockfishActiveEngine) return stockfishActiveEngine;
  if (!stockfishEnginePromise) {
    stockfishEnginePromise = (async () => {
      let lastError = null;
      for (const candidate of STOCKFISH_CANDIDATES) {
        try {
          setAnalysisStatus('Loading ' + candidate.name + '...');
          const engine = await createStockfishFromCandidate(candidate);
          stockfishActiveEngine = engine;
          return engine;
        } catch (err) {
          lastError = err;
          console.warn(err);
        }
      }
      throw lastError || new Error('Stockfish could not load.');
    })();
  }
  return stockfishEnginePromise;
}

function scoreToWhiteEval(score) {
  if (!score) return { eval: 0, cp: 0, mate: null };
  const pov = score.side === 'w' ? 1 : -1;
  if (score.type === 'mate') {
    const whiteMate = score.value * pov;
    const sign = whiteMate > 0 ? 1 : -1;
    const evalPawns = sign * Math.max(10, STOCKFISH_MATE_PAWNS - Math.min(Math.abs(whiteMate), 20) * 0.08);
    return { eval: evalPawns, cp: sign * 2000, mate: whiteMate };
  }
  const whiteCp = score.value * pov;
  return { eval: clampNum(whiteCp / 100, -STOCKFISH_MATE_PAWNS, STOCKFISH_MATE_PAWNS), cp: whiteCp, mate: null };
}

function engineDepthForGame(plyCount) {
  if (plyCount <= 40) return 12;
  if (plyCount <= 80) return 11;
  return 10;
}

function uciToMove(board, uci, side) {
  if (!/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(uci || '')) return null;
  const from = sqToRC(uci.slice(0, 2));
  const to = sqToRC(uci.slice(2, 4));
  if (!inBounds(from.r, from.c) || !inBounds(to.r, to.c)) return null;
  const piece = board[from.r][from.c];
  if (!piece || piece[0] !== side) return null;
  return {
    from,
    to,
    piece,
    captured: board[to.r][to.c] || '',
    promotion: uci[4] ? uci[4].toUpperCase() : null,
    castle: piece[1] === 'K' && Math.abs(to.c - from.c) === 2 ? {
      rookFrom: { r: from.r, c: to.c > from.c ? 7 : 0 },
      rookTo: { r: from.r, c: to.c > from.c ? 5 : 3 }
    } : null
  };
}

function moveToSAN(board, move, side) {
  if (!move) return '';
  const pieceType = move.piece[1];
  if (pieceType === 'K' && Math.abs(move.to.c - move.from.c) === 2) return move.to.c > move.from.c ? 'O-O' : 'O-O-O';
  const dest = rcToSq(move.to);
  const capture = !!move.captured || (pieceType === 'P' && move.from.c !== move.to.c);
  let san = pieceType === 'P' ? '' : pieceType;
  if (pieceType !== 'P') {
    const rivals = generateLegalMoves(board, side).filter(other => {
      if (other.from.r === move.from.r && other.from.c === move.from.c) return false;
      return other.piece === move.piece && other.to.r === move.to.r && other.to.c === move.to.c;
    });
    if (rivals.length) {
      const sameFile = rivals.some(other => other.from.c === move.from.c);
      const sameRank = rivals.some(other => other.from.r === move.from.r);
      if (!sameFile) san += FILES[move.from.c];
      else if (!sameRank) san += String(8 - move.from.r);
      else san += FILES[move.from.c] + String(8 - move.from.r);
    }
  } else if (capture) {
    san += FILES[move.from.c];
  }
  if (capture) san += 'x';
  san += dest;
  if (move.promotion) san += '=' + move.promotion;
  const next = boardAfterLocalMove(board, move);
  const them = oppositeColor(side);
  if (isKingInCheck(next, them)) {
    san += generateLegalMoves(next, them).length ? '+' : '#';
  }
  return san;
}

function bestMoveTextFromUci(board, uci, side) {
  const move = uciToMove(board, uci, side);
  return moveToSAN(board, move, side) || uci || '';
}

function isMoveSacrifice(move, beforeEval, afterEval) {
  const info = move.info;
  if (!info || !info.to || !info.from) return false;
  const beforeBoard = boardHistory[move.histIdx - 1] || newChessBoard();
  const afterBoard = boardHistory[move.histIdx] || beforeBoard;
  const sign = move.side === 'w' ? 1 : -1;
  const materialDrop = (materialAdvantage(beforeBoard) - materialAdvantage(afterBoard)) * sign;
  const movedPiece = afterBoard[info.to.r]?.[info.to.c] || '';
  const hanging = movedPiece && pieceValue(movedPiece) >= 3 &&
    isSquareAttacked(afterBoard, info.to.r, info.to.c, oppositeColor(move.side)) &&
    !info.captured;
  const stayedSound = (afterEval - beforeEval) * sign >= -0.25;
  return stayedSound && (materialDrop >= 1 || hanging);
}

function centipawnLoss(beforeEval, afterEval, side) {
  const deltaForMover = (afterEval - beforeEval) * (side === 'w' ? 1 : -1);
  return Math.max(0, Math.min(2000, Math.round(-deltaForMover * 100)));
}

function classifyReviewedMove(move, i, beforeEval, afterEval) {
  const forced = annotationOverride(move.annotatedMove || move.move);
  if (forced) return forced;

  const localReview = localPositionReviews[i] || {};
  const playedUci = infoToUci(move.info);
  const bestUci = localReview.bestMoveUci || '';
  const cleanMove = move.move.replace(/[+#?!]/g, '');
  const quietOpeningMove = i < 8 && !move.move.includes('x') && !move.move.includes('+') && !move.move.includes('#');
  const loss = centipawnLoss(beforeEval, afterEval, move.side);

  if (move.move.includes('#')) return 'best';
  if (quietOpeningMove && loss <= 18 && OPENING_BOOK_SAN.has(cleanMove)) return 'book';
  if (bestUci && playedUci && bestUci === playedUci && isMoveSacrifice(move, beforeEval, afterEval) && i > 6) return 'brilliant';
  if (loss <= 8 || (bestUci && playedUci && bestUci === playedUci)) return 'best';
  if (loss <= 22) return 'excellent';
  if (loss <= 55) return 'good';
  if (loss <= 115) return 'inaccuracy';
  if (loss <= 240) return 'mistake';
  return 'blunder';
}

function sideName(side) {
  return side === 'w' ? 'White' : 'Black';
}

function evalPhrase(v) {
  if (typeof v !== 'number' || !Number.isFinite(v)) return 'unclear';
  if (Math.abs(v) < 0.25) return 'about equal';
  return (v > 0 ? 'White is better by ' : 'Black is better by ') + Math.abs(v).toFixed(1);
}

function describeMove(move, ann) {
  const loss = move.cpl || 0;
  const acc = move.moveAccuracy ?? 0;
  const before = evalPhrase(move.evalBefore);
  const after = evalPhrase(move.evalAfter);
  const best = move.bestMove ? ` Stockfish preferred ${move.bestMove}.` : '';
  const captureText = move.info?.captured ? ' It wins material without losing the thread.' : '';
  const checkText = move.move.includes('+') ? ' The check also limits the reply choices.' : '';
  const swingText = ` The position went from ${before} to ${after}.`;
  const base = {
    brilliant: `${move.move} is brilliant: a sound sacrifice or hard-to-find forcing move that stays with Stockfish's top line.${captureText}${checkText}`,
    best: `${move.move} matches Stockfish's first choice. It keeps the position on the strongest path.`,
    book: `${move.move} is a book move. The opening is still following normal theory.`,
    excellent: `${move.move} is excellent. It stays within ${loss} centipawns of the engine's top choice.`,
    good: `${move.move} is playable and keeps the game under control. Move accuracy ${acc}%, loss ${loss} cp.`,
    inaccuracy: `${move.move} is an inaccuracy and gives up about ${loss} centipawns.${swingText}${best}`,
    mistake: `${move.move} is a mistake. It changes the position noticeably and loses about ${loss} centipawns.${swingText}${best}`,
    blunder: `${move.move} is a blunder. It gives the opponent a major swing, losing about ${loss} centipawns.${swingText}${best}`,
    missed: `${move.move} missed a stronger continuation.${best}`
  };
  return base[ann] || `${move.move} is worth reviewing in this position.`;
}

function estimatePlayerRatingFromGame(side, report) {
  if (!report) return null;
  const moves = allMoves.filter(m => m.side === side && m.ann);
  const ratedMoves = moves.filter(m => m.ann !== 'book');
  if (!ratedMoves.length) return null;

  const accuracy = side === 'w' ? report.whiteAccuracy : report.blackAccuracy;
  const acpl = side === 'w' ? report.whiteAcpl : report.blackAcpl;
  if (!Number.isFinite(accuracy) || accuracy <= 0) return null;

  const total = ratedMoves.length;
  const count = ann => ratedMoves.filter(m => m.ann === ann).length;
  const bestish = count('brilliant') + count('great') + count('best') + count('excellent');
  const accuracyPart = 300 + Math.pow(clampNum(accuracy, 15, 99) / 100, 2.05) * 1950;
  const acplPenalty = Math.min(820, Math.log1p(Math.max(0, acpl || 0)) * 145);
  const qualityBonus = (bestish / total) * 260 + (count('brilliant') / total) * 180 + (count('great') / total) * 110;
  const mistakePenalty =
    (count('inaccuracy') / total) * 150 +
    (count('mistake') / total) * 410 +
    (count('blunder') / total) * 850 +
    (count('missed') / total) * 260;
  const samplePenalty = total < 10 ? 160 : total < 18 ? 70 : 0;
  const estimate = clampNum(accuracyPart - acplPenalty + qualityBonus - mistakePenalty - samplePenalty, 350, 2450);
  return Math.round(estimate / 25) * 25;
}

function formatRatingLabel(knownElo, estimatedElo) {
  const known = Number.isFinite(knownElo) ? `(${knownElo})` : '';
  const estimated = Number.isFinite(estimatedElo) ? `game est ${estimatedElo}` : '';
  return [known, estimated].filter(Boolean).join(' | ');
}

function renderEstimatedRatings(report) {
  const whiteEstimate = estimatePlayerRatingFromGame('w', report);
  const blackEstimate = estimatePlayerRatingFromGame('b', report);
  const whiteEl = document.getElementById('whiteRating');
  const blackEl = document.getElementById('blackRating');
  if (whiteEl) {
    whiteEl.textContent = formatRatingLabel(currentWhiteElo, whiteEstimate);
    whiteEl.title = Number.isFinite(whiteEstimate) ? 'Estimated from this game only' : '';
  }
  if (blackEl) {
    blackEl.textContent = formatRatingLabel(currentBlackElo, blackEstimate);
    blackEl.title = Number.isFinite(blackEstimate) ? 'Estimated from this game only' : '';
  }
}

function renderReviewSummary(report) {
  const summary = document.getElementById('reviewSummary');
  if (!summary) return;
  summary.style.display = 'grid';

  const avg = Math.round(((report.whiteAccuracy || 0) + (report.blackAccuracy || 0)) / 2);
  const sourceText = report.evalSource === 'stockfish' ? 'Stockfish 18'
    : report.evalSource === 'engine' ? 'PGN evals'
    : report.evalSource === 'cloud' ? 'cloud engine'
    : report.evalSource === 'cloud-mixed' ? 'cloud + local'
    : report.evalSource === 'mixed' ? 'mixed evals'
    : report.evalSource === 'local' ? 'local estimate'
    : 'estimated';
  document.getElementById('reviewGrade').textContent = report.evalSource === 'estimate' ? '--' : gradeFromAccuracy(avg);
  document.getElementById('reviewGradeSub').textContent = report.evalSource === 'estimate' ? 'Engine needed' : avg + '% - ' + sourceText;
  document.getElementById('bestMoveCount').textContent = (report.counts.brilliant || 0) + (report.counts.best || 0) + (report.counts.excellent || 0) + (report.counts.book || 0);
  document.getElementById('troubleMoveCount').textContent = (report.counts.inaccuracy || 0) + (report.counts.mistake || 0) + (report.counts.blunder || 0) + (report.counts.missed || 0);
  renderEstimatedRatings(report);
}

function computeAccuracy() {
  const wAcc = reviewReport ? reviewReport.whiteAccuracy : 0;
  const bAcc = reviewReport ? reviewReport.blackAccuracy : 0;
  const needsEngine = reviewReport?.evalSource === 'estimate';
  if (needsEngine) {
    document.getElementById('whiteAccuracy').textContent='--';
    document.getElementById('blackAccuracy').textContent='--';
    document.getElementById('whiteAccuracy').style.color='var(--muted)';
    document.getElementById('blackAccuracy').style.color='var(--muted)';
    document.getElementById('whiteAccSub').textContent='Engine needed';
    document.getElementById('blackAccSub').textContent='Engine needed';
    return;
  }
  document.getElementById('whiteAccuracy').textContent=wAcc+'%';
  document.getElementById('blackAccuracy').textContent=bAcc+'%';
  document.getElementById('whiteAccuracy').style.color=wAcc>=75?'#69923e':wAcc>=55?'#d4a843':'#c0392b';
  document.getElementById('blackAccuracy').style.color=bAcc>=75?'#69923e':bAcc>=55?'#d4a843':'#c0392b';
  const label = reviewReport?.evalSource === 'stockfish' ? 'Stockfish ACPL'
    : ['engine','cloud','cloud-mixed'].includes(reviewReport?.evalSource) ? 'ACPL'
    : 'Local ACPL';
  document.getElementById('whiteAccSub').textContent=`${label} ${reviewReport?.whiteAcpl ?? 0}`;
  document.getElementById('blackAccSub').textContent=`${label} ${reviewReport?.blackAcpl ?? 0}`;
}

function queueCloudEngineReview() {
  if (autoCloudReviewStarted || reviewReport?.evalSource === 'stockfish') return;
  autoCloudReviewStarted = true;
  setTimeout(() => {
    if (reviewReport?.evalSource !== 'stockfish') runCloudEngineReview({ auto: true });
  }, 500);
}

async function runCloudEngineReview(options={}) {
  if (!allMoves.length || !fenHistory.length) return;
  const btn = document.getElementById('engineReviewBtn');
  const fallbackLabel = btn ? btn.textContent : '';
  const depth = engineDepthForGame(allMoves.length);

  if (btn) {
    btn.disabled = true;
    btn.textContent = options.auto ? 'Stockfish 0/' + allMoves.length : 'Stockfish 0/' + allMoves.length;
  }
  setAnalysisStatus('Preparing Stockfish depth ' + depth + ' review...');

  try {
    const engine = await getStockfishEngine();
    const reviews = [];
    const evals = [];

    for (let i = 0; i < fenHistory.length; i++) {
      const fen = fenHistory[i];
      const side = fen.split(/\s+/)[1] || (i % 2 === 0 ? 'w' : 'b');
      if (btn) btn.textContent = `Stockfish ${i}/${allMoves.length}`;
      setAnalysisStatus(`Stockfish depth ${depth}: position ${i}/${allMoves.length}`);
      const result = await engine.analyzeFen(fen, depth);
      const bestSan = bestMoveTextFromUci(fen, result.bestMove, side);
      reviews[i] = {
        eval: result.eval,
        bestMoveText: bestSan || result.bestMove,
        bestMoveUci: result.bestMove,
        depth: result.depth,
        mate: result.mate,
        pv: result.pv,
        lines: result.lines || []
      };
      evals[i] = result.eval;
      if (i < fenHistory.length - 1) await delay(20);
    }

    localPositionReviews = reviews;
    reviewReport = reviewGame(currentMoveDetails, currentWhiteName, currentBlackName, evals, 'stockfish');
    applyReviewReport(reviewReport);
    buildMoveList();
    drawEvalChart();
    computeAccuracy();
    render();

    setAnalysisStatus('', false);
    if (btn) {
      btn.textContent = 'Stockfish Review Done';
      setTimeout(() => { btn.textContent = 'Run Stockfish Review'; }, 1600);
    }
  } catch (err) {
    console.warn(err);
    setAnalysisStatus('Stockfish could not load. The local review is still shown; serve this page online or check the Stockfish asset path.');
    if (btn) {
      btn.textContent = 'Stockfish unavailable';
      setTimeout(() => { btn.textContent = fallbackLabel || 'Run Stockfish Review'; }, 2400);
    }
  } finally {
    if (btn) btn.disabled = false;
  }
}

(function installChesskitInspiredLayer(){
  const legacy = {
    parsePGNDetails,
    buildBoardHistory,
    buildFenHistory,
    validateReplay,
    bestMoveTextFromUci,
    reviewGame,
    classifyReviewedMove,
    describeMove
  };

  function ChessCtor() {
    return window.ChessJs && window.ChessJs.Chess ? window.ChessJs.Chess : null;
  }

  function uciMoveParams(uciMove) {
    return {
      from: uciMove.slice(0, 2),
      to: uciMove.slice(2, 4),
      promotion: uciMove.slice(4, 5) || undefined
    };
  }

  function loadChessHistory(pgn) {
    const Chess = ChessCtor();
    if (!Chess) throw new Error('chess.js is not loaded');
    const game = new Chess();
    game.loadPgn(String(pgn || '').replace(/^\uFEFF/, ''), { strict: false });
    return game.history({ verbose: true });
  }

  function replaySanMoves(sanMoves) {
    const Chess = ChessCtor();
    if (!Chess) throw new Error('chess.js is not loaded');
    const game = new Chess();
    const moves = [];
    sanMoves.forEach(san => {
      const move = game.move(san);
      if (!move) throw new Error('Illegal move: ' + san);
      moves.push(move);
    });
    return moves;
  }

  function boardFromFen(fen) {
    const Chess = ChessCtor();
    if (!Chess) return newChessBoard();
    try {
      const game = new Chess(fen);
      return boardFromChess(game);
    } catch {
      return newChessBoard();
    }
  }

  function boardFromChess(game) {
    return game.board().map(row => row.map(piece => {
      if (!piece) return '';
      return piece.color + piece.type.toUpperCase();
    }));
  }

  function moveInfoFromVerbose(move) {
    const from = sqToRC(move.from);
    const to = sqToRC(move.to);
    const capturedColor = move.color === 'w' ? 'b' : 'w';
    const captured = move.captured ? capturedColor + move.captured.toUpperCase() : '';
    return {
      san: move.san,
      piece: move.piece.toUpperCase(),
      color: move.color,
      from,
      to,
      captured,
      promotion: move.promotion ? move.promotion.toUpperCase() : null,
      castle: /[kq]/.test(move.flags || ''),
      success: true,
      uci: move.from + move.to + (move.promotion || ''),
      before: move.before,
      after: move.after
    };
  }

  parsePGNDetails = function parsePGNDetailsWithChessJs(pgn) {
    const fallback = () => legacy.parsePGNDetails(pgn);
    if (!ChessCtor()) return fallback();
    try {
      const legacyDetails = fallback();
      return loadChessHistory(pgn).map((move, i) => ({
        san: move.san,
        annotatedSan: legacyDetails[i]?.annotatedSan || move.san,
        nags: legacyDetails[i]?.nags || [],
        comment: legacyDetails[i]?.comment || '',
        evalAfter: legacyDetails[i]?.evalAfter ?? null,
        uci: move.from + move.to + (move.promotion || ''),
        fenBefore: move.before,
        fenAfter: move.after,
        verbose: move
      }));
    } catch {
      return fallback();
    }
  };

  parsePGNMoves = function parsePGNMovesWithChessJs(pgn) {
    return parsePGNDetails(pgn).map(m => m.san);
  };

  validateReplay = function validateReplayWithChessJs(moveDetails) {
    if (!moveDetails.length) return { ok:false, message:'This PGN does not contain any moves.' };
    if (!ChessCtor()) return legacy.validateReplay(moveDetails);
    let failedIndex = -1;
    try {
      const Chess = ChessCtor();
      const game = new Chess();
      for (let i = 0; i < moveDetails.length; i++) {
        let move = null;
        try {
          move = game.move(moveDetails[i].san);
        } catch {
          failedIndex = i;
          throw new Error('Illegal move');
        }
        if (!move) {
          failedIndex = i;
          throw new Error('Illegal move');
        }
      }
      return { ok:true };
    } catch {
      if (failedIndex >= 0) {
        const moveNo = Math.floor(failedIndex / 2) + 1;
        const side = failedIndex % 2 === 0 ? 'White' : 'Black';
        return { ok:false, message:`I could not replay ${side}'s move ${moveNo}: ${moveDetails[failedIndex].san}. Paste a standard legal PGN.` };
      }
      for (let i = 0; i < moveDetails.length; i++) {
        if (moveDetails[i].fenBefore && moveDetails[i].fenAfter) continue;
        const moveNo = Math.floor(i / 2) + 1;
        const side = i % 2 === 0 ? 'White' : 'Black';
        return { ok:false, message:`I could not replay ${side}'s move ${moveNo}: ${moveDetails[i].san}. Paste a standard legal PGN.` };
      }
      return { ok:false, message:'This PGN could not be replayed. Paste a standard legal PGN.' };
    }
  };

  buildBoardHistory = function buildBoardHistoryWithChessJs(sanMoves) {
    if (!ChessCtor()) return legacy.buildBoardHistory(sanMoves);
    try {
      const moves = currentPGN ? loadChessHistory(currentPGN) : replaySanMoves(sanMoves);
      const firstFen = moves[0]?.before;
      const history = [firstFen ? boardFromFen(firstFen) : boardFromChess(new (ChessCtor())())];
      moveInfos = [];
      moves.forEach(move => {
        moveInfos.push(moveInfoFromVerbose(move));
        history.push(boardFromFen(move.after));
      });
      return history;
    } catch {
      return legacy.buildBoardHistory(sanMoves);
    }
  };

  buildFenHistory = function buildFenHistoryWithChessJs() {
    if (!ChessCtor()) return legacy.buildFenHistory();
    const fromDetails = currentMoveDetails && currentMoveDetails.length && currentMoveDetails[0].fenBefore;
    if (fromDetails) {
      return [currentMoveDetails[0].fenBefore].concat(currentMoveDetails.map(m => m.fenAfter));
    }
    try {
      const moves = currentPGN ? loadChessHistory(currentPGN) : replaySanMoves(allMoves.map(m => m.move));
      return [moves[0]?.before || new (ChessCtor())().fen()].concat(moves.map(m => m.after));
    } catch {
      return legacy.buildFenHistory();
    }
  };

  formatUciPv = function formatUciPvChesskit(fen, uciMoves) {
    const castlingRights = (fen || '').split(' ')[2] || '-';
    let canWhiteKing = castlingRights.includes('K');
    let canWhiteQueen = castlingRights.includes('Q');
    let canBlackKing = castlingRights.includes('k');
    let canBlackQueen = castlingRights.includes('q');
    return (uciMoves || []).map(uci => {
      if (uci === 'e1h1' && canWhiteKing) { canWhiteKing = false; return 'e1g1'; }
      if (uci === 'e1a1' && canWhiteQueen) { canWhiteQueen = false; return 'e1c1'; }
      if (uci === 'e8h8' && canBlackKing) { canBlackKing = false; return 'e8g8'; }
      if (uci === 'e8a8' && canBlackQueen) { canBlackQueen = false; return 'e8c8'; }
      return uci;
    });
  };

  bestMoveTextFromUci = function bestMoveTextFromUciWithChessJs(position, uci, side) {
    if (!uci) return '';
    if (ChessCtor() && typeof position === 'string' && position.includes(' ')) {
      try {
        const game = new (ChessCtor())(position);
        const move = game.move(uciMoveParams(uci));
        return move?.san || uci;
      } catch {
        return uci;
      }
    }
    return legacy.bestMoveTextFromUci(position, uci, side);
  };

  function getWinPercentageFromCp(cp) {
    const cpCeiled = clampNum(cp, -1000, 1000);
    const winChances = 2 / (1 + Math.exp(-0.00368208 * cpCeiled)) - 1;
    return 50 + 50 * winChances;
  }

  function getLineWinPercentage(line) {
    if (!line) return 50;
    if (typeof line.cp === 'number') return getWinPercentageFromCp(line.cp);
    if (typeof line.mate === 'number') return line.mate > 0 ? 100 : 0;
    if (typeof line.eval === 'number') return evalToWinPercent(line.eval);
    return 50;
  }

  function getPositionWinPercentage(review, fallbackEval) {
    if (review?.lines?.length) return getLineWinPercentage(review.lines[0]);
    if (typeof review?.eval === 'number') return evalToWinPercent(review.eval);
    return evalToWinPercent(fallbackEval || 0);
  }

  function getMaterialDifferenceFen(fen) {
    const Chess = ChessCtor();
    if (!Chess) return 0;
    try {
      const game = new Chess(fen);
      return game.board().flat().reduce((sum, square) => {
        if (!square) return sum;
        const value = { p:1, n:3, b:3, r:5, q:9, k:0 }[square.type] || 0;
        return sum + (square.color === 'w' ? value : -value);
      }, 0);
    } catch {
      return 0;
    }
  }

  function isSimplePieceRecaptureFen(fen, uciMoves) {
    const Chess = ChessCtor();
    if (!Chess || !fen || !uciMoves) return false;
    try {
      const game = new Chess(fen);
      const first = uciMoveParams(uciMoves[0]);
      const second = uciMoveParams(uciMoves[1]);
      return first.to === second.to && !!game.get(first.to);
    } catch {
      return false;
    }
  }

  function getIsPieceSacrificeFen(fen, playedMove, bestLinePvToPlay) {
    const Chess = ChessCtor();
    if (!Chess || !fen || !playedMove || !bestLinePvToPlay?.length) return false;
    try {
      const game = new Chess(fen);
      const whiteToPlay = game.turn() === 'w';
      const startingMaterial = getMaterialDifferenceFen(fen);
      let moves = [playedMove].concat(bestLinePvToPlay);
      if (moves.length % 2 === 1) moves = moves.slice(0, -1);
      let nonCapturingMovesTemp = 1;
      const capturedPieces = { w: [], b: [] };

      for (const move of moves) {
        const fullMove = game.move(uciMoveParams(move));
        if (!fullMove) return false;
        if (fullMove.captured) {
          capturedPieces[fullMove.color].push(fullMove.captured);
          nonCapturingMovesTemp = 1;
        } else {
          nonCapturingMovesTemp--;
          if (nonCapturingMovesTemp < 0) break;
        }
      }

      for (const p of capturedPieces.w.slice(0)) {
        if (capturedPieces.b.includes(p)) {
          capturedPieces.b.splice(capturedPieces.b.indexOf(p), 1);
          capturedPieces.w.splice(capturedPieces.w.indexOf(p), 1);
        }
      }

      const remainingCaptures = capturedPieces.w.concat(capturedPieces.b);
      if (Math.abs(capturedPieces.w.length - capturedPieces.b.length) <= 1 && remainingCaptures.every(p => p === 'p')) {
        return false;
      }

      const materialDiff = getMaterialDifferenceFen(game.fen()) - startingMaterial;
      const playerRelativeDiff = whiteToPlay ? materialDiff : -materialDiff;
      return playerRelativeDiff < 0;
    } catch {
      return false;
    }
  }

  function isLosingOrAlternateCompletelyWinning(positionWin, altWin, isWhiteMove) {
    const isLosing = isWhiteMove ? positionWin < 50 : positionWin > 50;
    const alternateWinning = isWhiteMove ? altWin > 97 : altWin < 3;
    return isLosing || alternateWinning;
  }

  function isSplendidMoveChesskit(beforeWin, afterWin, isWhiteMove, playedMove, bestLinePv, fen, altWin) {
    if (typeof altWin !== 'number') return false;
    const winDiff = (afterWin - beforeWin) * (isWhiteMove ? 1 : -1);
    if (winDiff < -2) return false;
    if (!getIsPieceSacrificeFen(fen, playedMove, bestLinePv)) return false;
    return !isLosingOrAlternateCompletelyWinning(afterWin, altWin, isWhiteMove);
  }

  function isPerfectMoveChesskit(beforeWin, afterWin, isWhiteMove, altWin, fenTwoMovesAgo, uciMoves) {
    if (typeof altWin !== 'number') return false;
    const winDiff = (afterWin - beforeWin) * (isWhiteMove ? 1 : -1);
    if (winDiff < -2) return false;
    if (fenTwoMovesAgo && uciMoves && isSimplePieceRecaptureFen(fenTwoMovesAgo, uciMoves)) return false;
    if (isLosingOrAlternateCompletelyWinning(afterWin, altWin, isWhiteMove)) return false;
    const changedOutcome = winDiff > 10 && ((beforeWin < 50 && afterWin > 50) || (beforeWin > 50 && afterWin < 50));
    const onlyGoodMove = ((afterWin - altWin) * (isWhiteMove ? 1 : -1)) > 10;
    return changedOutcome || onlyGoodMove;
  }

  classifyReviewedMove = function classifyReviewedMoveChesskit(move, i, beforeEval, afterEval) {
    const forced = annotationOverride(move.annotatedMove || move.move);
    if (forced) return forced;

    const cleanMove = move.move.replace(/[+#?!]/g, '');
    const quietOpeningMove = i < 8 && !move.move.includes('x') && !move.move.includes('+') && !move.move.includes('#');
    const loss = centipawnLoss(beforeEval, afterEval, move.side);
    if (move.move.includes('#')) return 'best';
    if (quietOpeningMove && loss <= 24 && OPENING_BOOK_SAN.has(cleanMove)) return 'book';

    const beforeReview = localPositionReviews[i];
    const afterReview = localPositionReviews[i + 1];
    const playedUci = infoToUci(move.info);
    const bestUci = beforeReview?.bestMoveUci || beforeReview?.bestMove || beforeReview?.lines?.[0]?.pv?.[0] || '';

    if (beforeReview?.lines?.length && afterReview) {
      const beforeWin = getPositionWinPercentage(beforeReview, beforeEval);
      const afterWin = getPositionWinPercentage(afterReview, afterEval);
      const isWhiteMove = move.side === 'w';
      const altLine = beforeReview.lines.find(line => line.pv?.[0] !== playedUci);
      const altWin = altLine ? getLineWinPercentage(altLine) : undefined;
      const bestLinePv = afterReview.lines?.[0]?.pv || [];
      const fen = fenHistory[i];

      if (isSplendidMoveChesskit(beforeWin, afterWin, isWhiteMove, playedUci, bestLinePv, fen, altWin)) {
        return 'brilliant';
      }

      const fenTwoMovesAgo = i > 0 ? fenHistory[i - 1] : null;
      const uciNextTwoMoves = i > 0 ? [infoToUci(allMoves[i - 1]?.info), playedUci] : null;
      if (isPerfectMoveChesskit(beforeWin, afterWin, isWhiteMove, altWin, fenTwoMovesAgo, uciNextTwoMoves)) {
        return 'great';
      }

      if (playedUci && bestUci && playedUci === bestUci) return 'best';

      const winDiff = (afterWin - beforeWin) * (isWhiteMove ? 1 : -1);
      if (winDiff < -20) return 'blunder';
      if (winDiff < -10) return 'mistake';
      if (winDiff < -5) return 'inaccuracy';
      if (winDiff < -2) return 'good';
      return 'excellent';
    }

    if (playedUci && bestUci && playedUci === bestUci && isMoveSacrifice(move, beforeEval, afterEval) && i > 6) return 'brilliant';
    if (playedUci && bestUci && playedUci === bestUci) return 'best';
    if (loss <= 22) return 'excellent';
    if (loss <= 70) return 'good';
    if (loss <= 140) return 'inaccuracy';
    if (loss <= 280) return 'mistake';
    return 'blunder';
  };

  function ceilsNumber(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function weightedMean(values, weights) {
    const totalWeight = weights.reduce((sum, value) => sum + value, 0) || 1;
    return values.reduce((sum, value, i) => sum + value * (weights[i] || 1), 0) / totalWeight;
  }

  function harmonicMean(values) {
    if (!values.length) return 0;
    return values.length / values.reduce((sum, value) => sum + 1 / Math.max(value, 0.001), 0);
  }

  function standardDeviation(values) {
    if (!values.length) return 0;
    const mean = values.reduce((sum, value) => sum + value, 0) / values.length;
    const variance = values.reduce((sum, value) => sum + Math.pow(value - mean, 2), 0) / values.length;
    return Math.sqrt(variance);
  }

  function computeChesskitAccuracy(evalValues) {
    const winPercentages = evalValues.map(evalToWinPercent);
    const windowSize = ceilsNumber(Math.ceil(winPercentages.length / 10), 2, 8);
    const halfWindow = Math.round(windowSize / 2);
    const weights = [];
    for (let i = 1; i < winPercentages.length; i++) {
      const start = i - halfWindow;
      const end = i + halfWindow;
      const window = start < 0
        ? winPercentages.slice(0, windowSize)
        : end > winPercentages.length
          ? winPercentages.slice(-windowSize)
          : winPercentages.slice(start, end);
      weights.push(ceilsNumber(standardDeviation(window), 0.5, 12));
    }

    const moveAccuracies = winPercentages.slice(1).map((winPercent, index) => {
      const lastWinPercent = winPercentages[index];
      const isWhiteMove = index % 2 === 0;
      const winDiff = isWhiteMove
        ? Math.max(0, lastWinPercent - winPercent)
        : Math.max(0, winPercent - lastWinPercent);
      const raw = 103.1668100711649 * Math.exp(-0.04354415386753951 * winDiff) - 3.166924740191411;
      return Math.min(100, Math.max(0, raw + 1));
    });

    const playerAccuracy = side => {
      const remainder = side === 'w' ? 0 : 1;
      const values = moveAccuracies.filter((_, index) => index % 2 === remainder);
      const sideWeights = weights.filter((_, index) => index % 2 === remainder);
      if (!values.length) return 0;
      return Math.round((weightedMean(values, sideWeights) + harmonicMean(values.map(a => Math.max(a, 10)))) / 2);
    };

    return { white: playerAccuracy('w'), black: playerAccuracy('b') };
  }

  reviewGame = function reviewGameChesskit(moveDetails, wName, bName, evalOverride=null, sourceOverride=null) {
    const vals = Array.isArray(evalOverride) ? evalOverride.slice() : computeReviewEvalValues(moveDetails);
    const counts = {};
    let maxSwing = 0;
    const parsedEvalCount = moveDetails.filter(m => typeof m.evalAfter === 'number').length;

    allMoves.forEach((m, i) => {
      const beforeEval = vals[i] || 0;
      const afterEval = vals[i + 1] !== undefined ? vals[i + 1] : beforeEval;
      const loss = centipawnLoss(beforeEval, afterEval, m.side);
      const winLoss = moveWinLoss(beforeEval, afterEval, m.side);
      const review = localPositionReviews[i] || null;
      m.cpl = loss;
      m.winLoss = winLoss;
      m.moveAccuracy = moveAccuracyFromWinLoss(winLoss);
      m.bestMove = review?.bestMoveText || '';
      m.playedUci = infoToUci(m.info);
      const ann = classifyReviewedMove(m, i, beforeEval, afterEval);
      const deltaForMover = (afterEval - beforeEval) * (m.side === 'w' ? 1 : -1);
      m.ann = ann;
      m.evalBefore = beforeEval;
      m.evalAfter = afterEval;
      m.deltaForMover = deltaForMover;
      m.reviewComment = describeMove(m, ann);
      counts[ann] = (counts[ann] || 0) + 1;
      maxSwing = Math.max(maxSwing, Math.abs(deltaForMover));
    });

    const sideAcpl = side => {
      const moves = allMoves.filter(m => m.side === side);
      if (!moves.length) return 0;
      return Math.round(moves.reduce((sum, m) => sum + (m.cpl || 0), 0) / moves.length);
    };
    const accuracy = computeChesskitAccuracy(vals);

    return {
      evalValues: vals,
      counts,
      maxSwing,
      whiteAccuracy: accuracy.white,
      blackAccuracy: accuracy.black,
      whiteAcpl: sideAcpl('w'),
      blackAcpl: sideAcpl('b'),
      evalSource: sourceOverride || (parsedEvalCount === moveDetails.length ? 'engine' : 'local'),
      highlights: []
    };
  };

  describeMove = function describeMoveChesskit(move, ann) {
    const loss = move.cpl || 0;
    const acc = move.moveAccuracy ?? 0;
    const before = evalPhrase(move.evalBefore);
    const after = evalPhrase(move.evalAfter);
    const best = move.bestMove && !['best','book'].includes(ann) ? ` Best was ${move.bestMove}.` : '';
    const swingText = ` The position moved from ${before} to ${after}.`;
    const lines = {
      brilliant: `${move.move} is brilliant. It is a sound sacrifice or forcing idea that keeps the engine line strong.`,
      great: `${move.move} is a great move. It appears to be the key move that preserved or changed the outcome of the position.`,
      best: `${move.move} is Stockfish's top choice. It keeps the strongest continuation on the board.`,
      book: `${move.move} is a book move. The opening is still following normal theory.`,
      excellent: `${move.move} is excellent. It stays very close to the best engine line.`,
      good: `${move.move} is good. It gives up only a small amount of winning chances. Accuracy ${acc}%, loss ${loss} cp.`,
      inaccuracy: `${move.move} is an inaccuracy. It loses some winning chances.${swingText}${best}`,
      mistake: `${move.move} is a mistake. The evaluation swing is large enough to change the character of the game.${swingText}${best}`,
      blunder: `${move.move} is a blunder. It hands the opponent a major swing.${swingText}${best}`,
      missed: `${move.move} missed a stronger continuation.${best}`
    };
    return lines[ann] || legacy.describeMove(move, ann);
  };
})();
